<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>72ゴルフ Watch 試作 v2</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}.app{width:min(100%,360px);min-height:100vh;margin:auto;padding:12px 10px 18px}.hole{font-size:24px;font-weight:bold;margin:2px 0}.par{font-size:16px;margin-bottom:10px}.players{display:flex;flex-direction:column;gap:8px}.row{display:grid;grid-template-columns:70px 48px 1fr 48px;align-items:center;gap:5px}.name{text-align:left;font-size:17px;font-weight:bold}.value{font-size:24px;font-weight:bold}.btn{width:48px;height:48px;border:1px solid #666;border-radius:12px;background:#222;color:#fff;font-size:28px;font-weight:bold;padding:0}.btn:active{background:#555}.pat{margin-top:10px;padding-top:8px;border-top:1px solid #444}.pat .name{font-size:16px}.pat .value{font-size:21px}.nav{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:8px;background:#000}.nav button{width:100%;height:44px;font-size:16px}.status{font-size:12px;color:#aaa;margin-top:8px}
</style></head><body><div class="app"><div class="hole"><span id="hole">1</span>番</div><div class="par">PAR <span id="par">4</span></div><div class="players">
<div class="row"><div class="name">Aさん</div><button class="btn" onclick="changeScore(0,-1)">−</button><div class="value" id="s0">4</div><button class="btn" onclick="changeScore(0,1)">＋</button></div>
<div class="row"><div class="name">Bさん</div><button class="btn" onclick="changeScore(1,-1)">−</button><div class="value" id="s1">4</div><button class="btn" onclick="changeScore(1,1)">＋</button></div>
<div class="row"><div class="name">Cさん</div><button class="btn" onclick="changeScore(2,-1)">−</button><div class="value" id="s2">4</div><button class="btn" onclick="changeScore(2,1)">＋</button></div>
<div class="row"><div class="name">Dさん</div><button class="btn" onclick="changeScore(3,-1)">−</button><div class="value" id="s3">4</div><button class="btn" onclick="changeScore(3,1)">＋</button></div>
<div class="pat row"><div class="name">PAT</div><button class="btn" onclick="changePat(-1)">−</button><div class="value" id="pat">2</div><button class="btn" onclick="changePat(1)">＋</button></div>
</div><div class="nav"><button class="btn" onclick="prevHole()">◀ 前</button><button class="btn" onclick="nextHole()">次 ▶</button></div><div class="status">試作版：この端末内で入力を保持します</div></div>
<script>
const pars=[4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5];let hole=0;let scores=Array.from({length:4},()=>Array(18).fill(null));let pats=Array(18).fill(2);
function score(p){return scores[p][hole]??pars[hole]}
function render(){document.getElementById("hole").textContent=hole+1;document.getElementById("par").textContent=pars[hole];for(let p=0;p<4;p++)document.getElementById("s"+p).textContent=score(p);document.getElementById("pat").textContent=pats[hole]}
function changeScore(p,d){scores[p][hole]=Math.max(1,Math.min(12,score(p)+d));render()}
function changePat(d){pats[hole]=Math.max(0,Math.min(10,pats[hole]+d));render()}
function nextHole(){if(hole<17){hole++;render()}}
function prevHole(){if(hole>0){hole--;render()}}
render();
</script></body></html>
