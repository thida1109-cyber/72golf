@media(max-width:390px){

 .player-head,
 .player-row{
   grid-template-columns:1.15fr .85fr 38px 64px 38px
 }

 .player-head{
   font-size:11px
 }

 button{

 }

<body>

<div class="container">

<h1>72ゴルフ スコア管理</h1>


<!-- =========================
     スコア管理
========================= -->

<div class="card">

<div class="management-title">
スコア管理
</div>

<label>保存済みラウンド</label>

<select id="roundSelect">
  <option value="">ラウンドを選択してください</option>
</select>

<button class="new-round"
        onclick="newRound()">
新しいラウンド
</button>

<div class="round-info"
     id="roundInfo">
</div>

</div>


<!-- =========================
     ラウンド情報
========================= -->

<div class="card">

<label>ゴルフ場</label>

<input id="course"
       type="text"
       placeholder="ゴルフ場名">

<label>日付</label>

<input id="date"
       type="date">

<label>名前</label>

<input id="p1"
       type="text"
       placeholder="1人目">

<input id="p2"
       type="text"
       placeholder="2人目">

<input id="p3"
       type="text"
       placeholder="3人目">

<input id="p4"
       type="text"
       placeholder="4人目">

</div>


<!-- =========================
     ホール
========================= -->

<div class="card">

<div class="hole-row">

<div class="hole-no">
ホール番号　
<span id="hole">1</span>H
</div>

<div class="par-box">
<span>PAR</span>
<strong id="par">4</strong>
</div>

</div>


<div class="nav">

<button id="prevBtn"
        onclick="changeHole(-1)">
← 前のH
</button>

<button id="nextBtn"
        onclick="changeHole(1)">
次のH →
</button>

</div>


<details class="par-edit">

<summary>
コースPARを登録・変更（1～18H）
</summary>

<div id="parGrid"
     class="par-grid">
</div>

</details>

</div>


<!-- =========================
     スコア入力
========================= -->

<div class="card">

<div class="player-head">

<div>名前</div>

<div style="text-align:center">
ラウンド合計
</div>

<div></div>

<div style="text-align:center">
コーススコア
</div>

<div></div>

</div>

<div id="players"></div>

</div>


<!-- =========================
     保存・一覧
========================= -->

<div class="card">

<button class="save"
        onclick="saveCurrentRound(true)">
保存
</button>

<button class="list-btn"
        onclick="toggleScoreList()">
スコア一覧を表示
</button>

<div class="small"
     id="status"
     style="text-align:center;margin-top:7px">
</div>

<div id="scoreList"
     class="score-list">
</div>

</div>

</div>


<script>

/* ==================================================
   基本設定
================================================== */

const STORAGE_KEY="72golf_rounds_v6";

let rounds={};

let currentRoundId=null;

let hole=1;

let pars=Array(18).fill(4);

let scores=
Array.from(
  {length:4},
  ()=>Array(18).fill(null)
);


/* ==================================================
   共通
================================================== */

function $(id){
  return document.getElementById(id);
}


function todayString(){

  const d=new Date();

  const y=d.getFullYear();

  const m=
    String(d.getMonth()+1).padStart(2,"0");

  const day=
    String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function makeRoundId(){

  return Date.now().toString();

}


/* ==================================================
   ラウンドデータ読み込み
================================================== */

function loadRounds(){

  try{

    const data=
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)||"{}"
      );

    if(
      data &&
      typeof data==="object"
    ){

      rounds=data;

    }else{

      rounds={};

    }

  }catch(e){

    rounds={};

  }

}


/* ==================================================
   ラウンド全体保存
================================================== */

function saveRounds(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(rounds)
  );

}


/* ==================================================
   現在データ
================================================== */

function getCurrentData(){

  return {

    course:$("course").value,

    date:$("date").value,

    players:
      ["p1","p2","p3","p4"]
      .map(id=>$(id).value),

    pars:
      pars.slice(0,18),

    scores:
      scores.map(
        arr=>arr.slice(0,18)
      ),

    updatedAt:
      new Date().toISOString()

  };

}


/* ==================================================
   現在ラウンド保存
================================================== */

function saveCurrentRound(showStatus=false){

  if(!$("date").value){

    $("date").value=
      todayString();

  }


  if(!currentRoundId){

    currentRoundId=
      makeRoundId();

  }


  rounds[currentRoundId]=
    getCurrentData();


  saveRounds();

  updateRoundSelect();

  updateRoundInfo();


  if(showStatus){

    $("status").textContent=
      "保存しました";

    setTimeout(()=>{

      $("status").textContent="";

    },1500);

  }

}


/* ==================================================
   ラウンド読み込み
================================================== */

function loadRound(id){

  const d=rounds[id];

  if(!d)return;


  currentRoundId=id;


  $("course").value=
    d.course||"";

  $("date").value=
    d.date||"";


  ["p1","p2","p3","p4"]
  .forEach((id2,i)=>{

    $(id2).value=
      (d.players||[])[i]||"";

  });


  if(Array.isArray(d.pars)){

    pars=
      d.pars.slice(0,18);

  }else{

    pars=
      Array(18).fill(4);

  }


  while(pars.length<18)
    pars.push(4);


  if(Array.isArray(d.scores)){

    scores=
      d.scores.map(arr=>{

        const a=
          Array.isArray(arr)
          ? arr.slice(0,18)
          : [];

        while(a.length<18)
          a.push(null);

        return a;

      });

  }else{

    scores=
      Array.from(
        {length:4},
        ()=>Array(18).fill(null)
      );

  }


  while(scores.length<4){

    scores.push(
      Array(18).fill(null)
    );

  }


  hole=1;


  update();

  updateRoundSelect();

  updateRoundInfo();

}


/* ==================================================
   新しいラウンド
================================================== */

function newRound(){

  /*
    現在のラウンドを保存して残す
  */

  if(currentRoundId){

    saveCurrentRound(false);

  }


  /*
    新しいラウンド
  */

  currentRoundId=
    makeRoundId();

  hole=1;

  pars=
    Array(18).fill(4);

  scores=
    Array.from(
      {length:4},
      ()=>Array(18).fill(null)
    );


  $("course").value="";

  $("date").value=
    todayString();


  ["p1","p2","p3","p4"]
  .forEach(id=>{
    $(id).value="";
  });


  saveCurrentRound(false);

  update();

  updateRoundSelect();

  updateRoundInfo();


  $("status").textContent=
    "新しいラウンドを開始しました";


  setTimeout(()=>{

    $("status").textContent="";

  },1800);

}


/* ==================================================
   ラウンド選択
================================================== */

function updateRoundSelect(){

  const select=
    $("roundSelect");


  select.innerHTML=
    `<option value="">
      ラウンドを選択してください
     </option>`;


  const ids=
    Object.keys(rounds)
    .sort((a,b)=>{

      const da=
        rounds[a].date||"";

      const db=
        rounds[b].date||"";

      return db.localeCompare(da);

    });


  ids.forEach(id=>{

    const d=
      rounds[id];


    const option=
      document.createElement("option");


    option.value=id;


    option.textContent=
      `${d.date||"日付未設定"}　${d.course||"ゴルフ場未設定"}`;


    if(id===currentRoundId){

      option.selected=true;

    }


    select.appendChild(option);

  });

}


$("roundSelect").addEventListener(
  "change",
  function(){

    if(this.value){

      loadRound(this.value);

    }

  }
);


/* ==================================================
   ラウンド情報
================================================== */

function updateRoundInfo(){

  if(!currentRoundId){

    $("roundInfo").textContent="";

    return;

  }


  const d=
    rounds[currentRoundId];


  if(!d)return;


  $("roundInfo").textContent=
    "現在のラウンド："+
    (d.date||"")+
    "　"+
    (d.course||"");

}


/* ==================================================
   ホール移動
================================================== */

function changeHole(delta){

  /*
    現在の入力を保存
  */

  saveCurrentRound(false);


  const n=
    hole+delta;


  if(n<1||n>18)return;


  hole=n;


  update();

}


/* ==================================================
   PAR変更
================================================== */

function changePar(index,delta){

  pars[index]=
    Math.max(
      3,
      Math.min(
        6,
        Number(pars[index]||4)+delta
      )
    );


  saveCurrentRound(false);

  update();

}


/* ==================================================
   PAR一覧
================================================== */

function drawParGrid(){

  let html="";


  for(let i=0;i<18;i++){

    html+=`

      <div class="par-item">

        <span>${i+1}H</span>

        <button type="button"
          onclick="changePar(${i},-1)">
          －
        </button>

        <b>${pars[i]}</b>

        <button type="button"
          onclick="changePar(${i},1)">
          ＋
        </button>

      </div>

    `;

  }


  $("parGrid").innerHTML=
    html;

}


/* ==================================================
   スコア変更
================================================== */

function changeScore(i,delta){

  const h=
    hole-1;


  let current=
    scores[i][h];


  /*
    初回はPARから開始
  */

  if(
    current===null ||
    current===undefined
  ){

    current=
      Number(pars[h]);

  }else{

    current=
      Number(current);

  }


  const newScore=
    Math.max(
      1,
      Math.min(
        15,
        current+delta
      )
    );


  scores[i][h]=
    newScore;


  /*
    即時保存
  */

  saveCurrentRound(false);


  updatePlayersOnly();


  if(
    $("scoreList")
    .classList
    .contains("show")
  ){

    drawScoreList();

  }

}


/* ==================================================
   ラウンド合計
================================================== */

function roundTotal(i){

  return scores[i]
    .slice(0,hole)
    .reduce(
      (a,b,j)=>{

        return a+
          (
            b==null
            ? pars[j]
            : Number(b)
          );

      },
      0
    );

}


/* ==================================================
   OUT
================================================== */

function outTotal(i){

  let total=0;


  for(let h=0;h<9;h++){

    total+=
      scores[i][h]==null
      ? pars[h]
      : Number(scores[i][h]);

  }


  return total;

}


/* ==================================================
   IN
================================================== */

function inTotal(i){

  let total=0;


  for(let h=9;h<18;h++){

    total+=
      scores[i][h]==null
      ? pars[h]
      : Number(scores[i][h]);

  }


  return total;

}


/* ==================================================
   TOTAL
================================================== */

function allTotal(i){

  return
    outTotal(i)+
    inTotal(i);

}


/* ==================================================
   画面更新
================================================== */

function update(){

  $("hole").textContent=
    hole;

  $("par").textContent=
    pars[hole-1];


  drawParGrid();


  $("prevBtn").disabled=
    hole===1;

  $("nextBtn").disabled=
    hole===18;


  updatePlayersOnly();

}


/* ==================================================
   プレーヤー表示
================================================== */

function updatePlayersOnly(){

  const names=
    ["p1","p2","p3","p4"]
    .map(
      id=>$(id).value||"名前"
    );


  let html="";


  for(let i=0;i<4;i++){

    const s=
      scores[i][hole-1]==null
      ? pars[hole-1]
      : scores[i][hole-1];


    html+=`

      <div class="player-row">

        <div class="name">
          ${escapeHtml(names[i])}
        </div>

        <div class="total">
          ${roundTotal(i)}
        </div>

        <button class="pm"
          onclick="changeScore(${i},-1)">
          －
        </button>

        <div class="score">
          ${s}
        </div>

        <button class="pm"
          onclick="changeScore(${i},1)">
          ＋
        </button>

      </div>

    `;

  }


  $("players").innerHTML=
    html;

}


/* ==================================================
   スコア一覧
================================================== */

function toggleScoreList(){

  const box=
    $("scoreList");


  if(
    box.classList.contains("show")
  ){

    box.classList.remove("show");

    document.querySelector(".list-btn")
      .textContent=
      "スコア一覧を表示";

  }else{

    drawScoreList();

    box.classList.add("show");

    document.querySelector(".list-btn")
      .textContent=
      "スコア一覧を閉じる";

  }

}


/* ==================================================
   スコア一覧作成
================================================== */

function drawScoreList(){

  const names=
    ["p1","p2","p3","p4"]
    .map(
      id=>$(id).value||"名前"
    );


  /*
    縦型スコアカード

    H | PAR | A | B | C | D
  */

  let html=`

    <table class="score-table">

      <tr>
        <th>H</th>
        <th>PAR</th>
        ${names.map(n=>
          `<th>${escapeHtml(n)}</th>`
        ).join("")}
      </tr>

  `;


  /*
    1～18H
  */

  for(let h=0;h<18;h++){

    html+=`

      <tr>

        <th>${h+1}</th>

        <td>${pars[h]}</td>

    `;


    for(let i=0;i<4;i++){

      const s=
        scores[i][h]==null
        ? ""
        : scores[i][h];


      html+=`
        <td>${s}</td>
      `;

    }


    html+=`

      </tr>

    `;

  }


  /*
    OUT
  */

  html+=`

    <tr class="out-row">

      <th colspan="2">OUT</th>

  `;


  for(let i=0;i<4;i++){

    html+=`
      <td>${outTotal(i)}</td>
    `;

  }


  html+=`

    </tr>

  `;


  /*
    IN
  */

  html+=`

    <tr class="in-row">

      <th colspan="2">IN</th>

  `;


  for(let i=0;i<4;i++){

    html+=`
      <td>${inTotal(i)}</td>
    `;

  }


  html+=`

    </tr>

  `;


  /*
    TOTAL
  */

  html+=`

    <tr class="total-row">

      <th colspan="2">TOTAL</th>

  `;


  for(let i=0;i<4;i++){

    html+=`
      <td>${allTotal(i)}</td>
    `;

  }


  html+=`

    </tr>

    </table>

  `;


  $("scoreList").innerHTML=
    html;

}


/* ==================================================
   入力変更
================================================== */

["course","date","p1","p2","p3","p4"]
.forEach(id=>{

  $(id).addEventListener(
    "input",
    ()=>{

      /*
        入力内容も自動保存
      */

      saveCurrentRound(false);


      updatePlayersOnly();


      if(
        $("scoreList")
        .classList
        .contains("show")
      ){

        drawScoreList();

      }

    }
  );

});


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* ==================================================
   起動
================================================== */

loadRounds();


const ids=
  Object.keys(rounds);


if(ids.length>0){

  /*
    最後に使用したラウンドを開く
  */

  const latest=
    ids.sort(
      (a,b)=>
        Number(b)-Number(a)
    )[0];


  loadRound(latest);

}else{

  currentRoundId=
    makeRoundId();

  hole=1;

  pars=
    Array(18).fill(4);

  scores=
    Array.from(
      {length:4},
      ()=>Array(18).fill(null)
    );


  $("date").value=
    todayString();


  saveCurrentRound(false);

  update();

}

</script>

</body>
</html>
