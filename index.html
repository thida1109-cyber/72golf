<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>72ゴルフ スコア管理</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}
.container{max-width:620px;margin:auto;padding:12px}
h1{text-align:center;font-size:22px;margin:6px 0 12px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,.12)}
label{font-size:13px;color:#666}
input[type=text],input[type=date]{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px;margin:4px 0 8px}
.hole-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hole-no{font-size:21px;font-weight:700;white-space:nowrap}
.par-box{display:flex;align-items:center;gap:7px;font-weight:700}
button{border:0;border-radius:9px;background:#e9e9e9;font-size:18px;min-height:42px;padding:7px 13px;touch-action:manipulation}
.nav{display:flex;gap:10px;margin-top:10px}
.nav button{flex:1;background:#333;color:#fff;font-size:16px}
.nav button:disabled{background:#bbb}
.player-head,.player-row{display:grid;grid-template-columns:1.25fr .95fr 42px 72px 42px;align-items:center;gap:5px}
.player-head{font-size:12px;color:#666;padding:3px 2px 7px}
.player-row{border-top:1px solid #eee;padding:8px 2px}
.name{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.total{text-align:center;font-size:16px;font-weight:600}
.score{text-align:center;font-size:21px;font-weight:700;background:#f2f2f2;border-radius:8px;padding:8px 2px;min-height:42px}
.pm{padding:4px;font-size:22px;min-height:42px}
.save{width:100%;background:#333;color:#fff;font-size:17px;margin-top:5px}
.small{font-size:12px;color:#777}
@media(max-width:390px){
 .player-head,.player-row{grid-template-columns:1.15fr .85fr 38px 64px 38px}
 .player-head{font-size:11px}
 button{padding:6px 9px}
}
</style>
</head>
<body>
<div class="container">
<h1>72ゴルフ スコア管理</h1>

<div class="card">
<label>ゴルフ場</label>
<input id="course" type="text" placeholder="ゴルフ場名">
<label>日付</label>
<input id="date" type="date">
<label>名前</label>
<input id="p1" type="text" placeholder="1人目">
<input id="p2" type="text" placeholder="2人目">
<input id="p3" type="text" placeholder="3人目">
<input id="p4" type="text" placeholder="4人目">
</div>

<div class="card">
<div class="hole-row">
  <div class="hole-no">ホール番号　<span id="hole">1</span>H</div>
  <div class="par-box">
    <span>PAR</span>
    <button onclick="changePar(-1)">－</button>
    <strong id="par">4</strong>
    <button onclick="changePar(1)">＋</button>
  </div>
</div>
<div class="nav">
  <button id="prevBtn" onclick="changeHole(-1)">← 前のH</button>
  <button id="nextBtn" onclick="changeHole(1)">次のH →</button>
</div>
</div>

<div class="card">
<div class="player-head">
  <div>名前</div>
  <div style="text-align:center">ラウンド合計</div>
  <div></div>
  <div style="text-align:center">コーススコア</div>
  <div></div>
</div>
<div id="players"></div>
</div>

<div class="card">
<button class="save" onclick="saveData()">保存</button>
<div class="small" id="status" style="text-align:center;margin-top:7px"></div>
</div>
</div>

<script>
const KEY="72golf_v4_simple";
let hole=1;
let pars=Array(18).fill(4);
let scores=Array.from({length:4},()=>Array(18).fill(0));

function $(id){return document.getElementById(id)}

function loadData(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"null");
    if(d){
      $("course").value=d.course||"";
      $("date").value=d.date||"";
      ["p1","p2","p3","p4"].forEach((id,i)=>$(id).value=(d.players||[])[i]||"");
      if(Array.isArray(d.pars)) pars=d.pars.slice(0,18);
      while(pars.length<18) pars.push(4);
      if(Array.isArray(d.scores)) scores=d.scores;
    }
  }catch(e){}
  update();
}

function saveData(){
  const data={
    course:$("course").value,
    date:$("date").value,
    players:["p1","p2","p3","p4"].map(id=>$(id).value),
    pars:pars,
    scores:scores
  };
  localStorage.setItem(KEY,JSON.stringify(data));
  $("status").textContent="保存しました";
  setTimeout(()=>{$("status").textContent=""},1500);
}

function changeHole(delta){
  const n=hole+delta;
  if(n<1||n>18)return;
  hole=n;
  update();
}

function changePar(delta){
  pars[hole-1]=Math.max(3,Math.min(6,pars[hole-1]+delta));
  update();
}

function changeScore(i,delta){
  const h=hole-1;
  scores[i][h]=Math.max(0,Math.min(15,(scores[i][h]||0)+delta));
  updatePlayersOnly();
}

function roundTotal(i){
  return scores[i].slice(0,hole).reduce((a,b)=>a+(Number(b)||0),0);
}

function update(){
  $("hole").textContent=hole;
  $("par").textContent=pars[hole-1];
  $("prevBtn").disabled=hole===1;
  $("nextBtn").disabled=hole===18;
  updatePlayersOnly();
}

function updatePlayersOnly(){
  const names=["p1","p2","p3","p4"].map(id=>$(id).value||"名前");
  let html="";
  for(let i=0;i<4;i++){
    const s=scores[i][hole-1]||0;
    html+=`
      <div class="player-row">
        <div class="name">${escapeHtml(names[i])}</div>
        <div class="total">${roundTotal(i)}</div>
        <button class="pm" onclick="changeScore(${i},-1)">－</button>
        <div class="score">${s}</div>
        <button class="pm" onclick="changeScore(${i},1)">＋</button>
      </div>`;
  }
  $("players").innerHTML=html;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

["course","date","p1","p2","p3","p4"].forEach(id=>{
  $(id).addEventListener("input",()=>updatePlayersOnly());
});

loadData();
</script>
</body>
</html>
