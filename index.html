<body>

<h1>72ゴルフ スコア管理</h1>

<!-- ラウンド管理 -->
<div class="card">
  <h2>スコア管理</h2>

  <div class="round-select">
    <select id="roundSelect" onchange="loadSelectedRound()">
      <option value="">保存済みラウンド</option>
    </select>

    <button onclick="newRound()">新しいラウンド</button>
  </div>

  <div id="roundInfo" class="round-info"></div>

  <button class="delete-button" onclick="deleteCurrentRound()">
    このラウンドを削除
  </button>
</div>

<!-- コース情報 -->
<div class="card">
  <h2>ラウンド情報</h2>

  <div class="course-grid">
    <div>
      <label>コース名</label>
      <input id="course" type="text" list="courseHistory" placeholder="コース名">
      <datalist id="courseHistory"></datalist>
    </div>

    <div>
      <label>日付</label>
      <input id="date" type="date">
    </div>
  </div>

  <div class="players-grid">
    <div>
      <label>Aさん</label>
      <input id="p1" type="text" placeholder="Aさん">
    </div>

    <div>
      <label>Bさん</label>
      <input id="p2" type="text" placeholder="Bさん">
    </div>

    <div>
      <label>Cさん</label>
      <input id="p3" type="text" placeholder="Cさん">
    </div>

    <div>
      <label>Dさん</label>
      <input id="p4" type="text" placeholder="Dさん">
    </div>
  </div>
</div>

<!-- PAR設定 -->
<div class="card">
  <details>
    <summary>PAR設定</summary>
    <div id="parList" class="par-list"></div>
  </details>
</div>

<!-- スコア入力 -->
<div class="card">

  <!-- ホール番号・PAR -->
  <div class="hole-info">

    <div>
      <span class="hole-label">HOLE</span>
      <span id="holeNo" class="hole-number">1</span>
    </div>

    <div>
      <span class="par-label">PAR</span>
      <span id="parNo" class="par-number">4</span>
    </div>

  </div>

  <!-- 前後ホール -->
  <div class="hole-navigation">
    <button onclick="prevHole()">◀ 前ホール</button>
    <button onclick="nextHole()">後ホール ▶</button>
  </div>

  <div class="score-title">
    スコア入力
  </div>

  <div class="score-header">
    <div>名前</div>
    <div>−</div>
    <div>スコア</div>
    <div>＋</div>
    <div>ホールまでの合計</div>
    <div>PAT</div>
  </div>

  <div id="scoreInputs"></div>

  <button class="main-button" onclick="saveCurrentRound()">
    このラウンドを保存
  </button>

  <button class="main-button" onclick="showScoreList()">
    スコア一覧
  </button>

</div>

<!-- スコア一覧 -->
<div id="scoreListCard" class="card hidden">
  <h2>スコア一覧</h2>

  <div class="score-list">
    <table class="score-table">
      <thead>
        <tr>
          <th>H</th>
          <th>PAR</th>
          <th>PAT</th>
          <th id="headP1">Aさん</th>
          <th id="headP2">Bさん</th>
          <th id="headP3">Cさん</th>
          <th id="headP4">Dさん</th>
        </tr>
      </thead>

      <tbody id="scoreTableBody"></tbody>
    </table>
  </div>
</div>

<script>

const STORAGE_KEY = "72golf_rounds_v6";

let rounds = {};
let currentRoundId = null;
let currentHole = 0;

let pars = Array(18).fill(4);

let scores = Array.from(
  {length:4},
  () => Array(18).fill(null)
);

let pats = Array(18).fill(null);


/* =========================
   初期化
========================= */

window.onload = function(){

  loadRounds();

  renderParList();

  renderScoreInputs();

  updateHoleDisplay();

  updateCourseHistory();

  if(!currentRoundId){
    setToday();
  }
};


/* =========================
   ラウンド保存データ
========================= */

function loadRounds(){

  const data = localStorage.getItem(STORAGE_KEY);

  if(data){
    try{
      rounds = JSON.parse(data);
    }catch(e){
      rounds = {};
    }
  }

  updateRoundSelect();
}


function saveRounds(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(rounds)
  );

  updateRoundSelect();
}


/* =========================
   ラウンド選択
========================= */

function updateRoundSelect(){

  const select = document.getElementById("roundSelect");

  select.innerHTML =
    '<option value="">保存済みラウンド</option>';

  const ids = Object.keys(rounds).sort(
    (a,b) => {
      return (rounds[b].savedAt || 0)
           - (rounds[a].savedAt || 0);
    }
  );

  ids.forEach(id => {

    const r = rounds[id];

    const option =
      document.createElement("option");

    option.value = id;

    option.textContent =
      (r.date || "") +
      " " +
      (r.course || "コース未入力");

    select.appendChild(option);
  });

  if(currentRoundId){
    select.value = currentRoundId;
  }
}


function loadSelectedRound(){

  const id =
    document.getElementById("roundSelect").value;

  if(!id){
    return;
  }

  loadRound(id);
}


/* =========================
   新しいラウンド
========================= */

function newRound(){

  currentRoundId =
    Date.now().toString();

  currentHole = 0;

  pars = Array(18).fill(4);

  scores = Array.from(
    {length:4},
    () => Array(18).fill(null)
  );

  pats = Array(18).fill(null);

  document.getElementById("course").value = "";

  setToday();

  for(let i=1;i<=4;i++){
    document.getElementById("p"+i).value = "";
  }

  saveCurrentRound();

  renderParList();

  renderScoreInputs();

  updateHoleDisplay();

  document.getElementById("scoreListCard")
    .classList.add("hidden");
}


/* =========================
   今日の日付
========================= */

function setToday(){

  const d = new Date();

  const yyyy = d.getFullYear();

  const mm =
    String(d.getMonth()+1).padStart(2,"0");

  const dd =
    String(d.getDate()).padStart(2,"0");

  document.getElementById("date").value =
    `${yyyy}-${mm}-${dd}`;
}


/* =========================
   現在ラウンド保存
========================= */

function saveCurrentRound(){

  if(!currentRoundId){
    currentRoundId =
      Date.now().toString();
  }

  const players = [
    document.getElementById("p1").value,
    document.getElementById("p2").value,
    document.getElementById("p3").value,
    document.getElementById("p4").value
  ];

  rounds[currentRoundId] = {

    course:
      document.getElementById("course").value,

    date:
      document.getElementById("date").value,

    players:players,

    pars:pars,

    scores:scores,

    pats:pats,

    lastHole:currentHole,

    savedAt:Date.now()
  };

  saveRounds();

  updateRoundInfo();

  updateCourseHistory();

  alert("ラウンドを保存しました。");
}


/* =========================
   ラウンド読み込み
========================= */

function loadRound(id){

  const r = rounds[id];

  if(!r){
    return;
  }

  currentRoundId = id;

  document.getElementById("course").value =
    r.course || "";

  document.getElementById("date").value =
    r.date || "";

  for(let i=0;i<4;i++){

    document.getElementById("p"+(i+1)).value =
      (r.players && r.players[i])
      ? r.players[i]
      : "";
  }

  pars =
    Array.isArray(r.pars)
    ? r.pars
    : Array(18).fill(4);

  scores =
    Array.isArray(r.scores)
    ? r.scores
    : Array.from(
        {length:4},
        () => Array(18).fill(null)
      );

  pats =
    Array.isArray(r.pats)
    ? r.pats
    : Array(18).fill(null);

  currentHole =
    Number.isInteger(r.lastHole)
    ? r.lastHole
    : 0;

  renderParList();

  renderScoreInputs();

  updateHoleDisplay();

  updateRoundSelect();

  updateRoundInfo();

  document.getElementById("scoreListCard")
    .classList.add("hidden");
}


/* =========================
   ラウンド情報
========================= */

function updateRoundInfo(){

  const r =
    currentRoundId
    ? rounds[currentRoundId]
    : null;

  const el =
    document.getElementById("roundInfo");

  if(!r){
    el.textContent = "";
    return;
  }

  el.textContent =
    "現在：" +
    (r.date || "") +
    "　" +
    (r.course || "コース未入力");
}


/* =========================
   ラウンド削除
========================= */

function deleteCurrentRound(){

  if(!currentRoundId){
    alert("削除するラウンドがありません。");
    return;
  }

  if(!confirm(
    "このラウンドの入力データを削除しますか？"
  )){
    return;
  }

  delete rounds[currentRoundId];

  currentRoundId = null;

  currentHole = 0;

  pars = Array(18).fill(4);

  scores = Array.from(
    {length:4},
    () => Array(18).fill(null)
  );

  pats = Array(18).fill(null);

  document.getElementById("course").value = "";

  for(let i=1;i<=4;i++){
    document.getElementById("p"+i).value = "";
  }

  setToday();

  saveRounds();

  renderParList();

  renderScoreInputs();

  updateHoleDisplay();

  updateRoundInfo();

  document.getElementById("scoreListCard")
    .classList.add("hidden");
}


/* =========================
   コース履歴
========================= */

function updateCourseHistory(){

  const datalist =
    document.getElementById("courseHistory");

  if(!datalist){
    return;
  }

  const names = [];

  Object.values(rounds).forEach(r => {

    if(r.course &&
       !names.includes(r.course)){

      names.push(r.course);
    }
  });

  datalist.innerHTML = "";

  names.forEach(name => {

    const option =
      document.createElement("option");

    option.value = name;

    datalist.appendChild(option);
  });
}


/* =========================
   PAR設定
========================= */

function renderParList(){

  const box =
    document.getElementById("parList");

  box.innerHTML = "";

  for(let h=0;h<18;h++){

    const item =
      document.createElement("div");

    item.className = "par-item";

    item.innerHTML = `

      <button onclick="changePar(${h},-1)">−</button>

      <div>
        <div>${h+1}H</div>
        <div class="par-value" id="parValue${h}">
          ${pars[h]}
        </div>
      </div>

      <button onclick="changePar(${h},1)">＋</button>

    `;

    box.appendChild(item);
  }
}


function changePar(h,delta){

  pars[h] += delta;

  if(pars[h] < 3){
    pars[h] = 3;
  }

  if(pars[h] > 5){
    pars[h] = 5;
  }

  document.getElementById(
    "parValue"+h
  ).textContent = pars[h];

  updateHoleDisplay();

  renderScoreInputs();
}


/* =========================
   ホール表示
========================= */

function updateHoleDisplay(){

  document.getElementById("holeNo")
    .textContent = currentHole + 1;

  document.getElementById("parNo")
    .textContent = pars[currentHole];

  updateRunningTotals();

  updateCurrentScoreDisplays();
}


/* =========================
   前後ホール
========================= */

function prevHole(){

  if(currentHole > 0){

    currentHole--;

    updateHoleDisplay();
  }
}


function nextHole(){

  if(currentHole < 17){

    currentHole++;

    updateHoleDisplay();
  }
}


/* =========================
   スコア取得
========================= */

function getScore(player,hole){

  const value =
    scores[player][hole];

  if(value === null ||
     value === undefined){

    return pars[hole];
  }

  return value;
}


/* =========================
   スコア変更
========================= */

function changeScore(player,hole,delta){

  let value =
    scores[player][hole];

  if(value === null ||
     value === undefined){

    value = pars[hole];
  }

  value += delta;

  if(value < 1){
    value = 1;
  }

  if(value > 15){
    value = 15;
  }

  scores[player][hole] = value;

  updateCurrentScoreDisplays();

  updateRunningTotals();
}


/* =========================
   PAT
========================= */

function getPat(hole){

  const value = pats[hole];

  if(value === null ||
     value === undefined){

    return 0;
  }

  return value;
}


function changePat(hole,delta){

  let value =
    pats[hole];

  if(value === null ||
     value === undefined){

    value = 0;
  }

  value += delta;

  if(value < 0){
    value = 0;
  }

  if(value > 10){
    value = 10;
  }

  pats[hole] = value;

  updatePatDisplay();
}


/* =========================
   スコア入力表示
========================= */

function renderScoreInputs(){

  const box =
    document.getElementById("scoreInputs");

  box.innerHTML = "";

  for(let p=0;p<4;p++){

    const row =
      document.createElement("div");

    row.className = "player-row";

    const name =
      document.getElementById("p"+(p+1)).value
      || ["Aさん","Bさん","Cさん","Dさん"][p];

    let patHTML = "";

    if(p === 0){

      patHTML = `
        <div class="pat-box">

          <button
            class="pat-button"
            onclick="changePat(currentHole,-1)"
          >−</button>

          <span
            class="pat-value"
            id="patValue"
          >${getPat(currentHole)}</span>

          <button
            class="pat-button"
            onclick="changePat(currentHole,1)"
          >＋</button>

        </div>
      `;

    }else{

      patHTML = `<div></div>`;
    }

    row.innerHTML = `

      <div class="player-name">
        ${escapeHtml(name)}
      </div>

      <button
        class="score-button"
        onclick="changeScore(${p},currentHole,-1)"
      >−</button>

      <div
        class="current-score"
        id="currentScore${p}"
      >${getScore(p,currentHole)}</div>

      <button
        class="score-button"
        onclick="changeScore(${p},currentHole,1)"
      >＋</button>

      <div
        class="hole-total"
        id="holeTotal${p}"
      >${getRunningTotal(p)}</div>

      ${patHTML}

    `;

    box.appendChild(row);
  }

  updateCurrentScoreDisplays();

  updatePatDisplay();

  updateRunningTotals();
}


/* =========================
   現在スコア表示
========================= */

function updateCurrentScoreDisplays(){

  for(let p=0;p<4;p++){

    const el =
      document.getElementById(
        "currentScore"+p
      );

    if(el){
      el.textContent =
        getScore(p,currentHole);
    }
  }
}


/* =========================
   PAT表示
========================= */

function updatePatDisplay(){

  const el =
    document.getElementById("patValue");

  if(el){
    el.textContent =
      getPat(currentHole);
  }
}


/* =========================
   ホールまでの合計
========================= */

function getRunningTotal(player){

  let total = 0;

  for(let h=0;h<=currentHole;h++){

    total += getScore(player,h);
  }

  return total;
}


function updateRunningTotals(){

  for(let p=0;p<4;p++){

    const el =
      document.getElementById(
        "holeTotal"+p
      );

    if(el){
      el.textContent =
        getRunningTotal(p);
    }
  }
}


/* =========================
   スコア一覧
========================= */

function showScoreList(){

  const card =
    document.getElementById(
      "scoreListCard"
    );

  card.classList.remove("hidden");

  for(let p=1;p<=4;p++){

    const name =
      document.getElementById("p"+p).value
      || ["Aさん","Bさん","Cさん","Dさん"][p-1];

    document.getElementById(
      "headP"+p
    ).textContent = name;
  }

  const tbody =
    document.getElementById(
      "scoreTableBody"
    );

  tbody.innerHTML = "";

  for(let h=0;h<18;h++){

    const tr =
      document.createElement("tr");

    let html = `
      <td>${h+1}</td>
      <td>${pars[h]}</td>
      <td>${getPat(h)}</td>
    `;

    for(let p=0;p<4;p++){

      html += `
        <td>${getScore(p,h)}</td>
      `;
    }

    tr.innerHTML = html;

    tbody.appendChild(tr);
  }

  addSummaryRow(
    tbody,
    0,

  );

  addSummaryRow(

/* =========================
   OUT / IN
========================= */

function addSummaryRow(
  tbody,
  start,
  end,
  label,
  scoreStart,
  scoreEnd
){

  const tr =
    document.createElement("tr");

  tr.className = "summary";

  let parTotal = 0;
  let patTotal = 0;

  for(let h=start;h<end;h++){

    parTotal += pars[h];

    patTotal += getPat(h);
  }

  let html = `
    <td colspan="1">${label}</td>
    <td>${parTotal}</td>
    <td>${patTotal}</td>
  `;

  for(let p=0;p<4;p++){

    let total = 0;

    for(let h=scoreStart;h<scoreEnd;h++){

      total += getScore(p,h);
    }

    html += `
      <td>${total}</td>
    `;
  }

  tr.innerHTML = html;

  tbody.appendChild(tr);
}

function addTotalRow(tbody){

  const tr =

  tr.className = "total";

  let parTotal = 0;

  for(let h=0;h<18;h++){

  `;

  for(let p=0;p<4;p++){

    let total = 0;

    `;
  }

  tr.innerHTML = html;

}

========================= */

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
