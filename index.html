<title>72ゴルフ スコア管理</title>

<style>
*{box-sizing:border-box}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  margin:0;
  padding:8px;
  background:#f5f5f5;
  color:#222;
}

  font-size:21px;
  margin:3px 0 8px;
}

  background:#fff;
  border-radius:8px;
  padding:9px;
  margin-bottom:8px;

}

  font-size:16px;
  margin:0 0 7px;

label{
  font-size:12px;
}

input,select{

  padding:3px 6px;

button{

  padding:7px 10px;

  display:flex;

}

  flex:1;

  white-space:nowrap;

  width:35px;

}

  display:flex;

  width:38px;

}

/* スコア */
.score-header{
  display:grid;
  grid-template-columns:1fr 70px;
  font-size:12px;
  color:#666;
  margin-bottom:3px;
}

.player-row{
  display:grid;
  grid-template-columns:minmax(80px,1fr) 40px 55px 40px 55px;
  align-items:center;
  gap:4px;

}

.player-name{
  font-size:15px;

  width:40px;

}

.hole-total{

/* 一覧 */
.score-table-wrap{
  overflow-x:auto;
}

.score-table{
  border-collapse:collapse;

}

.score-table th,
.score-table td{
  border:1px solid #ccc;
  padding:4px 2px;
  text-align:center;
}

.score-table th{
  background:#eee;
}

.score-table .summary{
  background:#f1f1f1;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>72ゴルフ スコア管理</h1>

<!-- スコア管理 -->
<div class="card">
  <h2>スコア管理</h2>

  <div class="manage-row">
    <select id="roundSelect" onchange="loadSelectedRound()">
      <option value="">保存済みラウンド</option>
    </select>

    <button onclick="newRound()">新しいラウンド</button>
  </div>

  <div id="roundInfo" class="small" style="margin-top:5px;"></div>
</div>


<!-- ラウンド情報 -->
<div class="card">

  <div class="info-grid">
    <input id="course"
           type="text"
           placeholder="コース名"
           oninput="autoSave()">

    <input id="date"
           type="date"
           onchange="autoSave()">
  </div>

  <div class="players-grid">

    <input id="p1"
           type="text"
           placeholder="Aさん"
           onchange="playerNameChanged()">

    <input id="p2"
           type="text"
           placeholder="Bさん"
           onchange="playerNameChanged()">

    <input id="p3"
           type="text"
           placeholder="Cさん"
           onchange="playerNameChanged()">

    <input id="p4"
           type="text"
           placeholder="Dさん"
           onchange="playerNameChanged()">

  </div>

</div>


<!-- ホール -->
<div class="card">

  <div class="hole-area">

    <div>
      <div class="small">HOLE</div>
      <div id="holeDisplay" class="hole-title">1H</div>
    </div>

    <div style="text-align:center;">
      <div class="small">PAR</div>
      <div id="parDisplay" class="par-title">4</div>
    </div>

  </div>

  <div class="navigation">
    <button onclick="prevHole()">◀ 前のホール</button>
    <button onclick="nextHole()">次のホール ▶</button>
  </div>

</div>


<!-- PAR設定 -->
<div class="card">

  <details>

    <summary>PAR設定</summary>

    <div class="small" style="margin-top:5px;">
      各ホールのPARを＋／－で変更できます
    </div>

    <div id="parList" class="par-list"></div>

  </details>

</div>


<!-- スコア入力 -->
<div class="card">

  <h2>スコア入力</h2>

  <div class="score-header">
    <div>プレイヤー</div>
    <div style="text-align:center;">ホールまで</div>
  </div>

  <div id="players"></div>

</div>


<!-- 保存・一覧 -->
<div class="card">

  <div class="manage-row">

    <button class="primary" onclick="saveCurrentRound()">
      保存
    </button>

    <button onclick="showScoreList()">
      スコア一覧
    </button>

  </div>

</div>


<!-- スコア一覧 -->
<div class="card" id="scoreListCard" style="display:none;">

  <h2>スコア一覧</h2>

  <div class="score-table-wrap">

    <table class="score-table">

      <thead id="scoreTableHead"></thead>

      <tbody id="scoreTableBody"></tbody>

    </table>

  </div>

</div>


<script>

/* ==========================================
   データ
========================================== */

const STORAGE_KEY = "72golf_rounds_v6";

let rounds = {};

let currentRoundId = null;

let currentHole = 0;

let pars = Array(18).fill(4);

let scores = Array.from(
  {length:4},
  () => Array(18).fill(null)
);


/* ==========================================
   起動
========================================== */

window.onload = function(){

  loadRounds();

  createParList();

  if(Object.keys(rounds).length){

    const ids = Object.keys(rounds);

    ids.sort(function(a,b){

      return (
        (rounds[b].date || "") +
        (rounds[b].savedAt || "")
      ).localeCompare(
        (rounds[a].date || "") +
        (rounds[a].savedAt || "")
      );

    });

    loadRound(ids[0]);

  }else{

    startBlankRound();

  }

  createPlayerRows();

  updateDisplay();

};


/* ==========================================
   ラウンド読み込み
========================================== */

function loadRounds(){

  try{

    const data =
      localStorage.getItem(STORAGE_KEY);

    if(data){
      rounds = JSON.parse(data);
    }

  }catch(e){

    rounds = {};

  }

  updateRoundSelect();

}


/* ==========================================
   全体保存
========================================== */

function saveRounds(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(rounds)
  );

}


/* ==========================================
   ラウンド選択
========================================== */

function updateRoundSelect(){

  const select =
    document.getElementById("roundSelect");

  if(!select) return;

  select.innerHTML =
    '<option value="">保存済みラウンド</option>';

  const ids =
    Object.keys(rounds);

  ids.sort(function(a,b){

    const aa =
      (rounds[a].date || "") +
      (rounds[a].savedAt || "");

    const bb =
      (rounds[b].date || "") +
      (rounds[b].savedAt || "");

    return bb.localeCompare(aa);

  });


  ids.forEach(function(id){

    const r = rounds[id];

    const option =
      document.createElement("option");

    option.value = id;

    let text = r.date || "";

    if(r.course){
      text += "  " + r.course;
    }

    if(!text){
      text = "ラウンド";
    }

    option.textContent = text;

    select.appendChild(option);

  });


  if(currentRoundId){
    select.value = currentRoundId;
  }

}


/* ==========================================
   新しいラウンド
========================================== */

function newRound(){

  if(currentRoundId){
    saveCurrentRound();
  }


  currentRoundId =
    Date.now().toString();

  currentHole = 0;

  pars = Array(18).fill(4);

  scores = Array.from(
    {length:4},
    () => Array(18).fill(null)
  );


  document.getElementById("course").value = "";

  document.getElementById("date").value =
    new Date().toISOString().slice(0,10);

  document.getElementById("p1").value = "";

  document.getElementById("p2").value = "";

  document.getElementById("p3").value = "";

  document.getElementById("p4").value = "";


  createParList();

  createPlayerRows();

  saveCurrentRound();

  updateDisplay();

  updateRoundSelect();

  document.getElementById("scoreListCard").style.display =
    "none";

}


/* ==========================================
   空のラウンド
========================================== */

function startBlankRound(){

  currentRoundId =
    Date.now().toString();

  currentHole = 0;

  pars = Array(18).fill(4);

  scores = Array.from(
    {length:4},
    () => Array(18).fill(null)
  );


  document.getElementById("date").value =
    new Date().toISOString().slice(0,10);

  saveCurrentRound();

}


/* ==========================================
   現在ラウンド保存
========================================== */

function saveCurrentRound(){

  if(!currentRoundId){

    currentRoundId =
      Date.now().toString();

  }


  rounds[currentRoundId] = {

    course:
      document.getElementById("course").value,

    date:
      document.getElementById("date").value,

    players:[
      document.getElementById("p1").value,
      document.getElementById("p2").value,
      document.getElementById("p3").value,
      document.getElementById("p4").value
    ],

    pars:[...pars],

    scores:
      scores.map(function(row){
        return [...row];
      }),

    /*
      最後に見ていたホール
    */
    lastHole:
      currentHole,

    savedAt:
      new Date().toISOString()

  };


  saveRounds();

  updateRoundSelect();

  updateRoundInfo();

}


/* ==========================================
   自動保存
========================================== */

function autoSave(){

  if(currentRoundId){
    saveCurrentRound();
  }

}


/* ==========================================
   プレイヤー名変更
========================================== */

function playerNameChanged(){

  createPlayerRows();

  saveCurrentRound();

}


/* ==========================================
   ラウンド読み込み
========================================== */

function loadSelectedRound(){

  const id =
    document.getElementById("roundSelect").value;

  if(id){
    loadRound(id);
  }

}


function loadRound(id){

  const r = rounds[id];

  if(!r) return;


  currentRoundId = id;


  document.getElementById("course").value =
    r.course || "";

  document.getElementById("date").value =
    r.date || "";


  const players =
    r.players || ["","","",""];

  document.getElementById("p1").value =
    players[0] || "";

  document.getElementById("p2").value =
    players[1] || "";

  document.getElementById("p3").value =
    players[2] || "";

  document.getElementById("p4").value =
    players[3] || "";


  pars =
    Array.isArray(r.pars)
      ? [...r.pars]
      : Array(18).fill(4);


  scores =
    Array.isArray(r.scores)
      ? r.scores.map(function(row){

          const result =
            Array(18).fill(null);

          if(Array.isArray(row)){

            for(let i=0;i<18;i++){
              result[i] =
                row[i] ?? null;
            }

          }

          return result;

        })
      : Array.from(
          {length:4},
          () => Array(18).fill(null)
        );


  currentHole =
    Number.isInteger(r.lastHole)
      ? r.lastHole
      : 0;


  if(currentHole < 0)
    currentHole = 0;

  if(currentHole > 17)
    currentHole = 17;


  createParList();

  createPlayerRows();

  updateDisplay();

  updateRoundSelect();

  updateRoundInfo();

  document.getElementById("scoreListCard").style.display =
    "none";

}


/* ==========================================
   ラウンド情報
========================================== */

function updateRoundInfo(){

  const r =
    rounds[currentRoundId];

  const info =
    document.getElementById("roundInfo");

  if(!r){
    info.textContent = "";
    return;
  }


  let text = "";

  if(r.course){
    text += r.course;
  }

  if(r.date){

    if(text) text += " / ";

    text += r.date;

  }

  info.textContent =
    text || "新規ラウンド";

}


/* ==========================================
   PAR設定
========================================== */

function createParList(){

  const list =
    document.getElementById("parList");

  if(!list) return;

  list.innerHTML = "";


  for(let h=0;h<18;h++){

    const row =
      document.createElement("div");

    row.className =
      "par-row";


    const hole =
      document.createElement("div");

    hole.className =
      "par-hole";

    hole.textContent =
      (h+1) + "H";


    const value =
      document.createElement("div");

    value.className =
      "par-value";

    value.id =
      "par-value-" + h;

    value.textContent =
      pars[h];


    const buttons =
      document.createElement("div");

    buttons.className =
      "par-buttons";


    const minus =
      document.createElement("button");

    minus.textContent = "−";

    minus.onclick = function(){

      changePar(h,-1);

    };


    const plus =
      document.createElement("button");

    plus.textContent = "+";

    plus.onclick = function(){

      changePar(h,1);

    };


    buttons.appendChild(minus);

    buttons.appendChild(plus);


    row.appendChild(hole);

    row.appendChild(value);

    row.appendChild(buttons);

    list.appendChild(row);

  }

}


/* ==========================================
   PAR変更
========================================== */

function changePar(hole,delta){

  pars[hole] += delta;


  if(pars[hole] < 3)
    pars[hole] = 3;

  if(pars[hole] > 6)
    pars[hole] = 6;


  const value =
    document.getElementById(
      "par-value-" + hole
    );

  if(value){
    value.textContent =
      pars[hole];
  }


  saveCurrentRound();

  updateDisplay();

}


/* ==========================================
   スコア入力欄
========================================== */

function createPlayerRows(){

  const container =
    document.getElementById("players");

  if(!container) return;

  container.innerHTML = "";


  const names = [

    document.getElementById("p1").value || "Aさん",

    document.getElementById("p2").value || "Bさん",

    document.getElementById("p3").value || "Cさん",

    document.getElementById("p4").value || "Dさん"

  ];


  for(let p=0;p<4;p++){

    const row =
      document.createElement("div");

    row.className =
      "player-row";


    const name =
      document.createElement("div");

    name.className =
      "player-name";

    name.textContent =
      names[p];


    const minus =
      document.createElement("button");

    minus.className =
      "score-button";

    minus.textContent =
      "−";

    minus.onclick = function(){

      changeScore(p,-1);

    };


    const score =
      document.createElement("div");

    score.className =
      "current-score";

    score.id =
      "score-" + p;


    const plus =
      document.createElement("button");

    plus.className =
      "score-button";

    plus.textContent =
      "+";

    plus.onclick = function(){

      changeScore(p,1);

    };


    const total =
      document.createElement("div");

    total.className =
      "hole-total";

    total.id =
      "total-" + p;


    total.innerHTML =
      '<span class="total-label">合計</span>0';


    row.appendChild(name);

    row.appendChild(minus);

    row.appendChild(score);

    row.appendChild(plus);

    row.appendChild(total);

    container.appendChild(row);

  }


  updatePlayerScores();

}


/* ==========================================
   スコア変更
========================================== */

function changeScore(player,delta){

  let value =
    scores[player][currentHole];


  /*
    初めて変更する場合はPARから開始
  */

  if(value === null ||
     value === undefined){

    value =
      pars[currentHole];

  }


  value += delta;


  if(value < 1)
    value = 1;

  if(value > 15)
    value = 15;


  scores[player][currentHole] =
    value;


  saveCurrentRound();

  updatePlayerScores();

}


/* ==========================================
   スコア取得

   未入力ならPAR
========================================== */

function getScore(player,hole){

  const value =
    scores[player][hole];

  if(value === null ||
     value === undefined){

    return pars[hole];

  }

  return value;

}


/* ==========================================
   現在ホールの表示
========================================== */

function updatePlayerScores(){

  for(let p=0;p<4;p++){

    const scoreElement =
      document.getElementById(
        "score-" + p
      );

    const totalElement =
      document.getElementById(
        "total-" + p
      );


    if(scoreElement){

      scoreElement.textContent =
        getScore(p,currentHole);

    }


    if(totalElement){

      let total = 0;

      /*
        1番ホールから現在ホールまで
      */

      for(let h=0;h<=currentHole;h++){

        total +=
          getScore(p,h);

      }


      totalElement.innerHTML =
        '<span class="total-label">合計</span>' +
        total;

    }

  }

}


/* ==========================================
   画面更新
========================================== */

function updateDisplay(){

  document.getElementById("holeDisplay").textContent =
    (currentHole + 1) + "H";


  document.getElementById("parDisplay").textContent =
    pars[currentHole];


  updatePlayerScores();

  updateRoundInfo();

}


/* ==========================================
   前のホール
========================================== */

function prevHole(){

  if(currentHole > 0){

    currentHole--;

    saveCurrentRound();

    updateDisplay();

  }

}


/* ==========================================
   次のホール
========================================== */

function nextHole(){

  if(currentHole < 17){

    currentHole++;

    saveCurrentRound();

    updateDisplay();

  }

}


/* ==========================================
   スコア一覧
========================================== */

function showScoreList(){

  const card =
    document.getElementById(
      "scoreListCard"
    );

  card.style.display = "block";


  const head =
    document.getElementById(
      "scoreTableHead"
    );

  const body =
    document.getElementById(
      "scoreTableBody"
    );


  head.innerHTML = "";

  body.innerHTML = "";


  const names = [

    document.getElementById("p1").value || "Aさん",

    document.getElementById("p2").value || "Bさん",

    document.getElementById("p3").value || "Cさん",

    document.getElementById("p4").value || "Dさん"

  ];


  /* ヘッダー */

  const header =
    document.createElement("tr");


  ["H","PAR",...names].forEach(function(text){

    const th =
      document.createElement("th");

    th.textContent = text;

    header.appendChild(th);

  });


  head.appendChild(header);


  /* 1～18H */

  for(let h=0;h<18;h++){

    const tr =
      document.createElement("tr");


    let td =
      document.createElement("td");

    td.textContent =
      h+1;

    tr.appendChild(td);


    td =
      document.createElement("td");

    td.textContent =
      pars[h];

    tr.appendChild(td);


    for(let p=0;p<4;p++){

      td =
        document.createElement("td");

      /*
        ここも未入力ならPARを表示
      */

      td.textContent =
        getScore(p,h);

      tr.appendChild(td);

    }


    body.appendChild(tr);

  }


  /* OUT */

  addSummaryRow(
    body,
    "OUT",
    getPar(0,9),
    0,
    9
  );


  /* IN */

  addSummaryRow(
    body,
    "IN",
    getPar(9,18),
    9,
    18
  );


  /* TOTAL */

  addTotalRow(body);


  card.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* ==========================================
   PAR合計
========================================== */

function getPar(start,end){

  let total = 0;

  for(let h=start;h<end;h++){

    total += pars[h];

  }

  return total;

}


/* ==========================================
   OUT / IN
========================================== */

function addSummaryRow(
  body,
  label,
  parTotal,
  start,
  end
){

  const tr =
    document.createElement("tr");

  tr.className =
    "summary";


  let td =
    document.createElement("td");

  td.textContent =
    label;

  tr.appendChild(td);


  td =
    document.createElement("td");

  td.textContent =
    parTotal;

  tr.appendChild(td);


  for(let p=0;p<4;p++){

    let total = 0;

    for(let h=start;h<end;h++){

      total +=
        getScore(p,h);

    }


    td =
      document.createElement("td");

    td.textContent =
      total;

    tr.appendChild(td);

  }


  body.appendChild(tr);

}


/* ==========================================
   TOTAL
========================================== */

function addTotalRow(body){

  const tr =
    document.createElement("tr");

  tr.className =
    "summary";


  let td =
    document.createElement("td");

  td.textContent =
    "TOTAL";

  tr.appendChild(td);


  td =
    document.createElement("td");

  td.textContent =
    getPar(0,18);

  tr.appendChild(td);


  for(let p=0;p<4;p++){

    let total = 0;

    for(let h=0;h<18;h++){

      total +=
        getScore(p,h);

    }


    td =
      document.createElement("td");

    td.textContent =
      total;

    tr.appendChild(td);

  }


  body.appendChild(tr);

}

</script>

</body>
</html>
