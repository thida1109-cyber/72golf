<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>72ゴルフ 第5版</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#f3f6f3;

  color:#222;

  font-family:-apple-system,BlinkMacSystemFont,

  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;

}

.wrap{

  max-width:900px;

  margin:auto;

  padding:8px;

}

h1{

  text-align:center;

  font-size:24px;

  margin:7px 0 12px;

}

h2{

  font-size:19px;

  margin:5px 0 12px;

}

.card{

  background:#fff;

  border:1px solid #aaa;

  border-radius:10px;

  padding:10px;

  margin-bottom:10px;

}

label{

  display:block;

  font-weight:bold;

  margin:8px 0 4px;

}

input,select{

  width:100%;

  font-size:18px;

  padding:9px;

  border:1px solid #888;

  border-radius:6px;

}

button{

  border:1px solid #777;

  border-radius:8px;

  background:#fff;

  font-size:17px;

  padding:9px;

  touch-action:manipulation;

}

button:active{

  transform:scale(.97);

}

.primary{

  font-weight:bold;

  background:#eaf3ff;

}

.nav{

  display:flex;

  gap:7px;

  margin:10px 0;

}

.nav button{

  flex:1;

}

.hidden{

  display:none;

}

.info{

  text-align:center;

  font-weight:bold;

  margin:5px 0;

}

.hole-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  font-weight:bold;

  font-size:19px;

  border-bottom:1px solid #aaa;

  padding-bottom:7px;

}

.note{

  text-align:center;

  font-size:12px;

  color:#555;

  margin:7px 0;

}

.score-table{

  width:100%;

  border-collapse:collapse;

  table-layout:fixed;

}

.score-table th,

.score-table td{

  border:1px solid #888;

  text-align:center;

  padding:5px;

}

.score-table th{

  background:#e9eeee;

  font-size:13px;

}

.score-table .player{

  width:25%;

  text-align:left;

  white-space:nowrap;

  overflow:hidden;

  padding-left:5px;

}

.score-table .score{

  width:23%;

}

.score-table .total{

  width:24%;

  font-weight:bold;

}

.score-table .putt{

  width:28%;

}

.score-controls{

  display:flex;

  justify-content:center;

  gap:3px;

  align-items:center;

}

.smallbtn{

  font-size:20px;

  min-width:39px;

  padding:7px 4px;

}

.score{

  font-size:21px;

  font-weight:bold;

  width:54px;

  text-align:center;

  padding:6px;

}

.sum{

  font-size:18px;

  font-weight:bold;

}

.puttinput{

  width:45px;

  text-align:center;

  font-size:18px;

  padding:5px;

}

.result-scroll{

  overflow-x:auto;

}

.result{

  border-collapse:collapse;

  min-width:680px;

  width:100%;

  background:#fff;

}

.result th,

.result td{

  border:1px solid #777;

  padding:5px;

  text-align:center;

  white-space:nowrap;

}

.result th{

  background:#e9eeee;

}

.result .big{

  font-size:22px;

  font-weight:bold;

}

.message{

  text-align:center;

  font-weight:bold;

  min-height:21px;

}

@media(max-width:430px){

  h1{

    font-size:22px;

  }

  .card{

    padding:7px;

  }

  .score-table th{

    font-size:11px;

  }

  .score-table td{

    padding:3px;

  }

  .score{

    width:47px;

    font-size:19px;

  }

  .smallbtn{

    min-width:35px;

    font-size:19px;

    padding:7px 2px;

  }

  .sum{

    font-size:16px;

  }

  .puttinput{

    width:42px;

  }

  button{

    font-size:15px;

  }

}

</style>

</head>

<body>

<div class="wrap">

<!-- =========================

     画面1

========================= -->

<section id="screen1">

<h1>72ゴルフ 第5版</h1>

<div class="card">

<h2>① 基本情報</h2>

<label>ゴルフ場名</label>

<input id="course" type="text" placeholder="ゴルフ場名">

<label>日付</label>

<input id="date" type="date">

<label>スタート</label>

<select id="start">

<option value="OUT">

OUTスタート

</option>

<option value="IN">

INスタート

</option>

</select>

<label>1人目</label>

<input id="p1" placeholder="名前">

<label>2人目</label>

<input id="p2" placeholder="名前">

<label>3人目</label>

<input id="p3" placeholder="名前">

<label>4人目</label>

<input id="p4" placeholder="名前">

</div>

<div class="nav">

<button

class="primary"

onclick="begin()">

② スコア入力へ →

</button>

</div>

</section>

<!-- =========================

     画面2

========================= -->

<section id="screen2" class="hidden">

<h1>72ゴルフ 第5版</h1>

<div class="card">

<div id="info" class="info"></div>

<div class="hole-head">

<span id="hole">

第1ホール

</span>

<span id="par">

PAR 4

</span>

</div>

<div class="note">

各選手の「－」「＋」で個別に打数を変更できます。<br>

スコア欄を選択してキーボードの ← → でも変更できます。

</div>

<table class="score-table">

<thead>

<tr>

<th class="player">

選手

</th>

<th class="score">

打数

</th>

<th class="total">

ここまで

</th>

<th class="putt">

PUTT

</th>

</tr>

</thead>

<tbody>

<!-- 1人目 -->

<tr>

<td id="n0" class="player">

1

</td>

<td>

<div class="score-controls">

<button

class="smallbtn"

onclick="adjust(0,-1)">

－

</button>

<input

id="s0"

class="score"

type="number"

readonly

onclick="focusScore(0)"

>

<button

class="smallbtn"

onclick="adjust(0,1)">

＋

</button>

</div>

</td>

<td

id="t0"

class="sum">

0

</td>

<td>

<input

id="putt"

class="puttinput"

type="number"

min="0"

max="9"

inputmode="numeric"

>

</td>

</tr>

<!-- 2人目 -->

<tr>

<td id="n1" class="player">

2

</td>

<td>

<div class="score-controls">

<button

class="smallbtn"

onclick="adjust(1,-1)">

－

</button>

<input

id="s1"

class="score"

type="number"

readonly

onclick="focusScore(1)"

>

<button

class="smallbtn"

onclick="adjust(1,1)">

＋

</button>

</div>

</td>

<td

id="t1"

class="sum">

0

</td>

<td>

－

</td>

</tr>

<!-- 3人目 -->

<tr>

<td id="n2" class="player">

3

</td>

<td>

<div class="score-controls">

<button

class="smallbtn"

onclick="adjust(2,-1)">

－

</button>

<input

id="s2"

class="score"

type="number"

readonly

onclick="focusScore(2)"

>

<button

class="smallbtn"

onclick="adjust(2,1)">

＋

</button>

</div>

</td>

<td

id="t2"

class="sum">

0

</td>

<td>

－

</td>

</tr>

<!-- 4人目 -->

<tr>

<td id="n3" class="player">

4

</td>

<td>

<div class="score-controls">

<button

class="smallbtn"

onclick="adjust(3,-1)">

－

</button>

<input

id="s3"

class="score"

type="number"

readonly

onclick="focusScore(3)"

>

<button

class="smallbtn"

onclick="adjust(3,1)">

＋

</button>

</div>

</td>

<td

id="t3"

class="sum">

0

</td>

<td>

－

</td>

</tr>

</tbody>

</table>

<div

id="msg"

class="message">

</div>

</div>

<div class="nav">

<button

id="prev"

onclick="previousHole()">

← 前ホール

</button>

<button

class="primary"

onclick="nextHole()">

次ホール →

</button>

</div>

<div class="nav">

<button onclick="showResults()">

一覧・結果を見る

</button>

</div>

</section>

<!-- =========================

     画面3

========================= -->

<section id="screen3" class="hidden">

<h1>

72ゴルフ 結果

</h1>

<div

id="resultInfo"

class="info">

</div>

<div class="card">

<div class="result-scroll">

<table

id="result"

class="result">

</table>

</div>

</div>

<div class="nav">

<button onclick="backInput()">

← スコア入力へ

</button>

</div>

</section>

</div>

<script>

/* =========================

   基本設定

========================= */

const PAR = [

4,4,3,5,4,3,4,4,5,

4,4,3,5,4,3,4,4,5

];

let players = [];

let course = "";

let date = "";

let start = "OUT";

let holeNo = 0;

let score = [];

let putts = [];

let activePlayer = 0;

/* =========================

   短縮

========================= */

function $(id){

  return document.getElementById(id);

}

/* =========================

   ゲーム開始

========================= */

function begin(){

  course =

    $("course").value.trim()

    || "ゴルフ場";

  date =

    $("date").value;

  start =

    $("start").value;

  players = [

    $("p1").value.trim(),

    $("p2").value.trim(),

    $("p3").value.trim(),

    $("p4").value.trim()

  ];

  players =

    players.map(function(x,i){

      return x || "選手"+(i+1);

    });

  score =

    Array.from(

      {length:4},

      function(){

        return Array(18).fill(0);

      }

    );

  putts =

    Array(18).fill("");

  holeNo = 0;

  activePlayer = 0;

  for(let i=0;i<4;i++){

    $("n"+i).textContent =

      players[i];

  }

  $("info").textContent =

    course

    +(date ? "　"+date : "")

    +"　"

    +start

    +"スタート";

  $("screen1").classList.add("hidden");

  $("screen3").classList.add("hidden");

  $("screen2").classList.remove("hidden");

  render();

}

/* =========================

   ホール表示

========================= */

function render(){

  $("hole").textContent =

    "第"+(holeNo+1)+"ホール";

  $("par").textContent =

    "PAR "+PAR[holeNo];

  $("prev").disabled =

    holeNo === 0;

  for(let i=0;i<4;i++){

    if(!score[i][holeNo]){

      score[i][holeNo] =

        PAR[holeNo];

    }

    $("s"+i).value =

      score[i][holeNo];

    $("t"+i).textContent =

      through(i,holeNo);

  }

  $("putt").value =

    putts[holeNo];

  if(holeNo===17){

    $("msg").textContent =

      "18ホール目です。入力後「次ホール」で結果を表示します。";

  }else{

    $("msg").textContent = "";

  }

}

/* =========================

   累計

========================= */

function through(p,h){

  let n = 0;

  for(let k=0;k<=h;k++){

    n +=

      score[p][k]

      || PAR[k];

  }

  return n;

}

/* =========================

   個別スコア変更

========================= */

function adjust(p,d){

  if(!score[p][holeNo]){

    score[p][holeNo] =

      PAR[holeNo];

  }

  score[p][holeNo] =

    Math.max(

      1,

      Math.min(

        20,

        score[p][holeNo] + d

      )

    );

  activePlayer = p;

  $("s"+p).focus();

  render();

}

/* =========================

   選手選択

========================= */

function focusScore(p){

  activePlayer = p;

}

/* =========================

   現在ホール保存

========================= */

function save(){

  for(let i=0;i<4;i++){

    let v =

      parseInt(

        $("s"+i).value,

        10

      );

    score[i][holeNo] =

      Number.isFinite(v)

      ? Math.max(

          1,

          Math.min(20,v)

        )

      : PAR[holeNo];

  }

  putts[holeNo] =

    $("putt").value;

}

/* =========================

   次ホール

========================= */

function nextHole(){

  save();

  if(holeNo < 17){

    holeNo++;

    render();

  }else{

    showResults();

  }

}

/* =========================

   前ホール

========================= */

function previousHole(){

  save();

  if(holeNo > 0){

    holeNo--;

    render();

  }

}

/* =========================

   ← → キー

========================= */

document.addEventListener(

  "keydown",

  function(e){

    if(

      $("screen2")

      .classList

      .contains("hidden")

    ){

      return;

    }

    if(e.key === "ArrowLeft"){

      e.preventDefault();

      adjust(

        activePlayer,

        -1

      );

    }

    if(e.key === "ArrowRight"){

      e.preventDefault();

      adjust(

        activePlayer,

        1

      );

    }

  }

);

/* =========================

   結果表示

========================= */

function showResults(){

  save();

  $("screen2")

    .classList

    .add("hidden");

  $("screen3")

    .classList

    .remove("hidden");

  $("resultInfo").textContent =

    course

    +(date ? "　"+date : "")

    +"　"

    +start

    +"スタート";

  let h = "";

  h += "<thead>";

  h += "<tr>";

  h += "<th>ホール</th>";

  players.forEach(function(p){

    h +=

      "<th>"

      +esc(p)

      +"</th>";

  });

  h += "<th>PAR</th>";

  h += "</tr>";

  h += "</thead>";

  h += "<tbody>";

  /* 1～18ホール */

  for(let k=0;k<18;k++){

    h += "<tr>";

    h +=

      "<th>"

      +(k+1)

      +"</th>";

    for(let i=0;i<4;i++){

      h +=

        "<td>"

        +score[i][k]

        +"</td>";

    }

    h +=

      "<td>"

      +PAR[k]

      +"</td>";

    h += "</tr>";

  }

  /* 前半 */

  h += "<tr>";

  h += "<th>前半</th>";

  for(let i=0;i<4;i++){

    h +=

      "<td>"

      +sum(i,0,8)

      +"</td>";

  }

  h +=

    "<td>"

    +sumPar(0,8)

    +"</td>";

  h += "</tr>";

  /* 後半 */

  h += "<tr>";

  h += "<th>後半</th>";

  for(let i=0;i<4;i++){

    h +=

      "<td>"

      +sum(i,9,17)

      +"</td>";

  }

  h +=

    "<td>"

    +sumPar(9,17)

    +"</td>";

  h += "</tr>";

  /* 合計 */

  h += "<tr>";

  h +=

    "<th class='big'>合計</th>";

  for(let i=0;i<4;i++){

    h +=

      "<td class='big'>"

      +sum(i,0,17)

      +"</td>";

  }

  h +=

    "<td class='big'>"

    +sumPar(0,17)

    +"</td>";

  h += "</tr>";

  /* PUTT */

  h += "<tr>";

  h += "<th>PUTT</th>";

  h +=

    "<td>"

    +puttTotal()

    +"</td>";

  h += "<td>－</td>";

  h += "<td>－</td>";

  h += "<td>－</td>";

  h += "</tr>";

  h += "</tbody>";

  $("result").innerHTML = h;

}

/* =========================

   合計

========================= */

function sum(p,a,b){

  let n = 0;

  for(let k=a;k<=b;k++){

    n += score[p][k];

  }

  return n;

}

/* =========================

   PAR合計

========================= */

function sumPar(a,b){

  let n = 0;

  for(let k=a;k<=b;k++){

    n += PAR[k];

  }

  return n;

}

/* =========================

   PUTT合計

========================= */

function puttTotal(){

  let n = 0;

  for(let x of putts){

    let v =

      parseInt(x,10);

    if(Number.isFinite(v)){

      n += v;

    }

  }

  return n;

}

/* =========================

   入力画面へ戻る

========================= */

function backInput(){

  $("screen3")

    .classList

    .add("hidden");

  $("screen2")

    .classList

    .remove("hidden");

  render();

}

/* =========================

   HTML特殊文字対策

========================= */

function esc(s){

  return String(s).replace(

    /[&<>"']/g,

    function(m){

      return {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#039;"

      }[m];

    }

  );

}

</script>

</body>

</html>
