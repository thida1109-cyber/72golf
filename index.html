 button{

<body>

<div class="container">

<h1>72ゴルフ スコア管理</h1>


<!-- =========================
     保存ラウンド
========================= -->

<div class="card">

<label>保存済みラウンド</label>

<select id="roundSelect">

</select>

  <button class="new-round"
          onclick="newRound()">

  </button>

  <button class="reset-round"
          onclick="resetCurrentRound()">

  </button>

</div>

</div>


<!-- =========================

<div class="card">

<label>ゴルフ場</label>
<input id="course"
       type="text"
       placeholder="ゴルフ場名">

<label>日付</label>
<input id="date"
       type="date">

<input id="p1"
       type="text"
       placeholder="1人目">

       type="text"
       placeholder="2人目">

       type="text"
       placeholder="3人目">

<div class="card">

<div class="hole-row">

  <div class="hole-no">
    ホール番号　
    <span id="hole">1</span>H
  </div>

  <div class="par-box">
    <span>PAR</span>
    <strong id="par">4</strong>
  </div>

</div>


<div class="nav">

  <button id="prevBtn"
          onclick="changeHole(-1)">
    ← 前のH
  </button>

  <button id="nextBtn"
          onclick="changeHole(1)">
    次のH →
  </button>

</div>


<details class="par-edit">

<summary>
コースPARを登録・変更（1～18H）
</summary>

     class="par-grid">
</div>

</details>

</div>

     スコア入力
========================= -->

<div class="card">

<div class="player-head">

  <div>名前</div>

  <div style="text-align:center">

  </div>

  <div></div>

  <div style="text-align:center">

  </div>

  <div></div>

</div>

<div class="card">

<button class="save"
        onclick="saveCurrentRound(true)">
  保存
</button>

  スコア一覧を表示
</button>

     id="status"

</div>

</div>

<button class="list-btn"

  保存済みラウンドを表示
</button>

<div id="savedRounds"
     class="saved-rounds">
</div>

</div>


</div>


<script>

/* ==================================================
   基本設定
================================================== */

const STORAGE_KEY="72golf_rounds_v5";

let rounds={};

let currentRoundId=null;

let hole=1;

let pars=Array(18).fill(4);

let scores=
  Array.from(
    {length:4},
    ()=>Array(18).fill(null)
  );


/* ==================================================
   共通
================================================== */

function $(id){
  return document.getElementById(id);
}


function todayString(){

  const d=new Date();

  const y=d.getFullYear();

  const m=String(d.getMonth()+1).padStart(2,"0");

  const day=String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function makeRoundId(){

  return Date.now().toString();

}


/* ==================================================
   全ラウンド読み込み
================================================== */

function loadRounds(){

  try{

    const data=
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)||"{}"
      );

    if(data && typeof data==="object"){

      rounds=data;

    }else{

      rounds={};

    }

  }catch(e){

    rounds={};

  }

}


/* ==================================================
   全ラウンド保存
================================================== */

function saveRounds(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(rounds)
  );

}


/* ==================================================
   現在の画面データを取得
================================================== */

function getCurrentData(){

  return {

    course:$("course").value,

    date:$("date").value,

    players:
      ["p1","p2","p3","p4"]
      .map(id=>$(id).value),

    pars:pars.slice(0,18),

    scores:
      scores.map(
        arr=>arr.slice(0,18)
      )

  };

}


/* ==================================================
   現在のラウンドを保存
================================================== */

function saveCurrentRound(showStatus=false){

  /*
    日付が空の場合は今日の日付
  */

  if(!$("date").value){

    $("date").value=todayString();

  }


  /*
    まだラウンドIDがなければ作成
  */

  if(!currentRoundId){

    currentRoundId=makeRoundId();

  }


  const data=getCurrentData();

  data.updatedAt=
    new Date().toISOString();


  rounds[currentRoundId]=data;


  saveRounds();

  updateRoundSelect();

  updateRoundInfo();


  if(showStatus){

    $("status").textContent=
      "保存しました";

    setTimeout(()=>{

      $("status").textContent="";

    },1500);

  }

}


/* ==================================================
   ラウンド読み込み
================================================== */

function loadRound(id){

  const d=rounds[id];

  if(!d)return;


  currentRoundId=id;


  $("course").value=
    d.course||"";


  $("date").value=
    d.date||"";


  ["p1","p2","p3","p4"]
  .forEach((id2,i)=>{

    $(id2).value=
      (d.players||[])[i]||"";

  });


  if(Array.isArray(d.pars)){

    pars=d.pars.slice(0,18);

  }else{

    pars=Array(18).fill(4);

  }


  while(pars.length<18)
    pars.push(4);


  if(Array.isArray(d.scores)){

    scores=
      d.scores.map(arr=>{

        const a=
          Array.isArray(arr)
          ? arr.slice(0,18)
          : [];

        while(a.length<18)
          a.push(null);

        return a;

      });

  }else{

    scores=
      Array.from(
        {length:4},
        ()=>Array(18).fill(null)
      );

  }


  while(scores.length<4){

    scores.push(
      Array(18).fill(null)
    );

  }


  hole=1;


  update();

  updateRoundSelect();

  updateRoundInfo();

}


/* ==================================================
   新しいラウンド
================================================== */

function newRound(){

  /*
    現在のラウンドは保存して残す
  */

  if(
    currentRoundId &&
    (
      $("course").value ||
      $("date").value ||
      scores.some(
        a=>a.some(
          x=>x!==null
        )
      )
    )
  ){

    saveCurrentRound(false);

  }


  /*
    新規ラウンド
  */

  currentRoundId=makeRoundId();

  hole=1;

  pars=Array(18).fill(4);

  scores=
    Array.from(
      {length:4},
      ()=>Array(18).fill(null)
    );


  $("course").value="";

  $("date").value=todayString();

  ["p1","p2","p3","p4"]
  .forEach(id=>{
    $(id).value="";
  });


  update();

  updateRoundSelect();

  updateRoundInfo();

  $("status").textContent=
    "新しいラウンドを開始しました";

  setTimeout(()=>{

    $("status").textContent="";

  },1800);

}


/* ==================================================
   現在のラウンドだけリセット
================================================== */

function resetCurrentRound(){

  if(!currentRoundId){

    newRound();

    return;

  }


  if(
    !confirm(
      "現在のラウンドのスコア・PAR・参加者情報をリセットします。\n\n保存済みの他のラウンドには影響しません。"
    )
  ){

    return;

  }


  pars=Array(18).fill(4);

  scores=
    Array.from(
      {length:4},
      ()=>Array(18).fill(null)
    );


  hole=1;


  /*
    ゴルフ場・日付・名前は残す
  */

  saveCurrentRound(false);

  update();

  $("status").textContent=
    "現在のラウンドをリセットしました";

  setTimeout(()=>{

    $("status").textContent="";

  },1800);

}


/* ==================================================
   ラウンド選択
================================================== */

function updateRoundSelect(){

  const select=
    $("roundSelect");


  select.innerHTML=
    `<option value="">
      ラウンドを選択してください
     </option>`;


  const ids=
    Object.keys(rounds)
    .sort((a,b)=>{

      const da=
        rounds[a].date||"";

      const db=
        rounds[b].date||"";

      return db.localeCompare(da);

    });


  ids.forEach(id=>{

    const d=rounds[id];


    const option=
      document.createElement("option");


    option.value=id;


    const date=
      d.date||"日付未設定";


    const course=
      d.course||"ゴルフ場未設定";


    option.textContent=
      `${date}　${course}`;


    if(id===currentRoundId)
      option.selected=true;


    select.appendChild(option);

  });

}


$("roundSelect").addEventListener(
  "change",
  function(){

    if(this.value){

      loadRound(this.value);

    }

  }
);


/* ==================================================
   ラウンド情報
================================================== */

function updateRoundInfo(){

  if(!currentRoundId){

    $("roundInfo").textContent="";

    return;

  }


  const d=
    rounds[currentRoundId];


  if(!d){

    $("roundInfo").textContent="";

    return;

  }


  $("roundInfo").textContent=
    "現在のラウンド："+
    (d.date||"日付未設定")+
    "　"+
    (d.course||"ゴルフ場未設定");

}


/* ==================================================
   ホール移動
================================================== */

function changeHole(delta){

  /*
    移動前に自動保存
  */

  saveCurrentRound(false);


  const n=hole+delta;


  if(n<1||n>18)return;


  hole=n;


  update();

}


/* ==================================================
   PAR変更
================================================== */

function changePar(index,delta){

  pars[index]=
    Math.max(
      3,
      Math.min(
        6,
        Number(pars[index]||4)+delta
      )
    );


  /*
    PAR変更も即保存
  */

  saveCurrentRound(false);

  update();

}


/* ==================================================
   PAR一覧
================================================== */

function drawParGrid(){

  let html="";


  for(let i=0;i<18;i++){

    html+=`

      <div class="par-item">

        <span>${i+1}H</span>

        <button type="button"
          onclick="changePar(${i},-1)">
          －
        </button>

        <b>${pars[i]}</b>

        <button type="button"
          onclick="changePar(${i},1)">
          ＋
        </button>

      </div>

    `;

  }


  $("parGrid").innerHTML=html;

}


/* ==================================================
   スコア変更
================================================== */

function changeScore(i,delta){

  const h=hole-1;


  const current=
    scores[i][h]==null
    ? pars[h]
    : Number(scores[i][h]);


  scores[i][h]=
    Math.max(
      0,
      Math.min(
        15,
        current+delta
      )
    );


  /*
    スコア変更時に自動保存
  */

  saveCurrentRound(false);


  updatePlayersOnly();


  /*
    スコア一覧が開いていたら更新
  */

  if(
    $("scoreList")
    .classList
    .contains("show")
  ){

    drawScoreList();

  }

}


/* ==================================================
   ラウンド合計
================================================== */

function roundTotal(i){

  return scores[i]
    .slice(0,hole)
    .reduce(
      (a,b,j)=>
        a+
        (
          b==null
          ? pars[j]
          : Number(b)
        ),
      0
    );

}


/* ==================================================
   OUT
================================================== */

function outTotal(i){

  let total=0;


  for(let h=0;h<9;h++){

    total+=
      scores[i][h]==null
      ? pars[h]
      : Number(scores[i][h]);

  }


  return total;

}


/* ==================================================
   IN
================================================== */

function inTotal(i){

  let total=0;


  for(let h=9;h<18;h++){

    total+=
      scores[i][h]==null
      ? pars[h]
      : Number(scores[i][h]);

  }


  return total;

}


/* ==================================================
   TOTAL
================================================== */

function allTotal(i){

  return outTotal(i)+inTotal(i);

}


/* ==================================================
   画面更新
================================================== */

function update(){

  $("hole").textContent=hole;

  $("par").textContent=
    pars[hole-1];


  drawParGrid();


  $("prevBtn").disabled=
    hole===1;


  $("nextBtn").disabled=
    hole===18;


  updatePlayersOnly();

}


/* ==================================================
   プレーヤー表示
================================================== */

function updatePlayersOnly(){

  const names=
    ["p1","p2","p3","p4"]
    .map(id=>$(id).value||"名前");


  let html="";


  for(let i=0;i<4;i++){

    const s=
      scores[i][hole-1]==null
      ? pars[hole-1]
      : scores[i][hole-1];


    html+=`

      <div class="player-row">

        <div class="name">
          ${escapeHtml(names[i])}
        </div>

        <div class="total">
          ${roundTotal(i)}
        </div>

        <button class="pm"
          onclick="changeScore(${i},-1)">
          －
        </button>

        <div class="score">
          ${s}
        </div>

        <button class="pm"
          onclick="changeScore(${i},1)">
          ＋
        </button>

      </div>

    `;

  }


  $("players").innerHTML=html;

}


/* ==================================================
   スコア一覧表示
================================================== */

function toggleScoreList(){

  const box=
    $("scoreList");


  if(
    box.classList.contains("show")
  ){

    box.classList.remove("show");

    document.querySelectorAll(".list-btn")[0]
      .textContent=
      "スコア一覧を表示";

  }else{

    drawScoreList();

    box.classList.add("show");

    document.querySelectorAll(".list-btn")[0]
      .textContent=
      "スコア一覧を閉じる";

  }

}


/* ==================================================
   スコア一覧
================================================== */

function drawScoreList(){

  const names=
    ["p1","p2","p3","p4"]
    .map(id=>$(id).value||"名前");


  let html=`

    <table class="score-table">

      <tr>

        <th>H</th>

        ${names.map(n=>
          `<th>${escapeHtml(n)}</th>`
        ).join("")}

      </tr>


      <tr class="par-row">

        <td>PAR</td>

        ${pars.map(p=>
          `<td>${p}</td>`
        ).join("")}

      </tr>

  `;


  for(let h=0;h<18;h++){

    html+=`

      <tr>

        <th>${h+1}</th>

    `;


    for(let i=0;i<4;i++){

      const s=
        scores[i][h]==null
        ? ""
        : scores[i][h];


      html+=`
        <td>${s}</td>
      `;

    }


    html+=`</tr>`;

  }


  html+=`

    <tr class="out-row">

      <th>OUT</th>

  `;


  for(let i=0;i<4;i++){

    html+=`
      <td>${outTotal(i)}</td>
    `;

  }


  html+=`

    </tr>

    <tr class="in-row">

      <th>IN</th>

  `;


  for(let i=0;i<4;i++){

    html+=`
      <td>${inTotal(i)}</td>
    `;

  }


  html+=`

    </tr>

    <tr class="total-row">

      <th>TOTAL</th>

  `;


  for(let i=0;i<4;i++){

    html+=`
      <td>${allTotal(i)}</td>
    `;

  }


  html+=`

    </tr>

    </table>

  `;


  $("scoreList").innerHTML=html;

}


/* ==================================================
   保存済みラウンド一覧
================================================== */

function toggleSavedRounds(){

  const box=
    $("savedRounds");


  if(
    box.classList.contains("show")
  ){

    box.classList.remove("show");

    document.querySelectorAll(".list-btn")[1]
      .textContent=
      "保存済みラウンドを表示";

  }else{

    drawSavedRounds();

    box.classList.add("show");

    document.querySelectorAll(".list-btn")[1]
      .textContent=
      "保存済みラウンドを閉じる";

  }

}


/* ==================================================
   保存済みラウンド表示
================================================== */

function drawSavedRounds(){

  const ids=
    Object.keys(rounds)
    .sort((a,b)=>{

      return (
        (rounds[b].date||"")
        .localeCompare(
          rounds[a].date||""
        )
      );

    });


  if(ids.length===0){

    $("savedRounds").innerHTML=
      '<div class="small">保存されたラウンドはありません。</div>';

    return;

  }


  let html="";


  ids.forEach(id=>{

    const d=rounds[id];


    const names=
      (d.players||[])
      .filter(n=>n)
      .join("・");


    html+=`

      <div class="saved-round-item">

        <div class="saved-round-title">
          ${escapeHtml(d.date||"日付未設定")}
         　
          ${escapeHtml(d.course||"ゴルフ場未設定")}
        </div>

        <div class="saved-round-detail">
          ${escapeHtml(names||"参加者未登録")}
        </div>

        <button
          onclick="loadRound('${id}')">
          このラウンドを開く
        </button>

      </div>

    `;

  });


  $("savedRounds").innerHTML=html;

}


/* ==================================================
   入力変更
================================================== */

["course","date","p1","p2","p3","p4"]
.forEach(id=>{

  $(id).addEventListener(
    "input",
    ()=>{

      /*
        入力変更も自動保存
      */

      saveCurrentRound(false);

      if(

        .classList
        .contains("show")
      ){

        drawScoreList();

      }

    }
  );

});


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}
