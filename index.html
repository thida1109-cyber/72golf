<body>

<h1>72ゴルフ スコア管理</h1>

<!-- スコア管理 -->
<div class="card">

  <h2>スコア管理</h2>

  <label>保存済みラウンド</label>

  <div class="round-manage">
    <select id="roundSelect" onchange="loadSelectedRound()">
      <option value="">ラウンドを選択</option>

<div class="card">

    </div>

  </div>

  <div class="row">

      >
    </div>

    <div>
      <label>プレイヤー4</label>
      <input
        type="text"
        id="p4"

      >

</div>


<!-- 現在のホール -->
<div class="card">

  <div class="hole-box">

      <div class="small">現在のホール</div>
      <div id="holeDisplay" class="hole-number">1H</div>

</div>

<div class="card">

  </div>

  <div id="parGrid" class="par-grid"></div>

</div>

<div class="card">

  <h2>スコア入力</h2>

  <div id="players"></div>

  <div class="small">
    ※ ＋／－を押さなくても、スコア一覧では各ホールのPARがスコアとして表示されます。
  </div>

</div>

<div class="card">

  <div class="row">

    <button class="primary" onclick="saveCurrentRound()">
      保存
    </button>

    <button onclick="showScoreList()">
      スコア一覧を表示
    </button>

  </div>

</div>


<!-- スコア一覧 -->
<div class="card" id="scoreListCard" style="display:none;">

  <h2>スコア一覧</h2>

  <div class="score-table-wrap">
    <table class="score-table">

      <thead id="scoreTableHead"></thead>

      <tbody id="scoreTableBody"></tbody>

    </table>
  </div>

</div>


<script>

/* ==========================================
   基本設定
========================================== */

const STORAGE_KEY = "72golf_rounds_v6";

let rounds = {};

let currentRoundId = null;

let currentHole = 0;

let pars = Array(18).fill(4);

let scores = Array.from(
  {length:4},
  () => Array(18).fill(null)
);


/* ==========================================
   初期処理
========================================== */

window.onload = function(){

  loadRounds();

  createParInputs();

  createPlayerRows();

  if(Object.keys(rounds).length > 0){

    const ids = Object.keys(rounds);

    ids.sort(function(a,b){

      const da = rounds[a].date || "";
      const db = rounds[b].date || "";

      return db.localeCompare(da);

    });

    loadRound(ids[0]);

  }else{

    startBlankRound();

  }

  updateDisplay();

};


/* ==========================================
   保存データ読み込み
========================================== */

function loadRounds(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){

      rounds = JSON.parse(saved);

    }

  }catch(e){

    rounds = {};

  }

  updateRoundSelect();

}


/* ==========================================
   保存データ全体を保存
========================================== */

function saveRounds(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(rounds)
  );

}


/* ==========================================
   ラウンド選択欄
========================================== */

function updateRoundSelect(){

  const select =
    document.getElementById("roundSelect");

  select.innerHTML =
    '<option value="">ラウンドを選択</option>';

  const ids = Object.keys(rounds);

  ids.sort(function(a,b){

    const da =
      (rounds[a].date || "") +
      "_" +
      (rounds[a].savedAt || "");

    const db =
      (rounds[b].date || "") +
      "_" +
      (rounds[b].savedAt || "");

    return db.localeCompare(da);

  });


  ids.forEach(function(id){

    const r = rounds[id];

    const option =
      document.createElement("option");

    option.value = id;

    let text = "";

    if(r.date){
      text += r.date;
    }

    if(r.course){
      text += "  " + r.course;
    }

    if(!text){
      text = "新規ラウンド";
    }

    option.textContent = text;

    select.appendChild(option);

  });


  if(currentRoundId &&
     rounds[currentRoundId]){

    select.value = currentRoundId;

  }

}


/* ==========================================
   新規ラウンド
========================================== */

function newRound(){

  /*
    現在のラウンドを保存
    ↓
    新しいIDを作成
    ↓
    完全に新しいデータを作る
  */

  if(currentRoundId){

    saveCurrentRound();

  }


  currentRoundId =
    Date.now().toString();


  currentHole = 0;

  pars = Array(18).fill(4);

  scores = Array.from(
    {length:4},
    () => Array(18).fill(null)
  );


  document.getElementById("course").value = "";

  document.getElementById("date").value =
    new Date().toISOString().slice(0,10);

  document.getElementById("p1").value = "";

  document.getElementById("p2").value = "";

  document.getElementById("p3").value = "";

  document.getElementById("p4").value = "";


  saveCurrentRound();

  createParInputs();

  createPlayerRows();

  updateDisplay();

  updateRoundSelect();

  document.getElementById("scoreListCard").style.display =
    "none";

}


/* ==========================================
   空のラウンド開始
========================================== */

function startBlankRound(){

  currentRoundId =
    Date.now().toString();

  currentHole = 0;

  pars = Array(18).fill(4);

  scores = Array.from(
    {length:4},
    () => Array(18).fill(null)
  );


  document.getElementById("date").value =
    new Date().toISOString().slice(0,10);

  saveCurrentRound();

}


/* ==========================================
   現在のラウンドを保存
========================================== */

function saveCurrentRound(){

  if(!currentRoundId){
    currentRoundId =
      Date.now().toString();
  }


  rounds[currentRoundId] = {

    course:
      document.getElementById("course").value,

    date:
      document.getElementById("date").value,

    players:[
      document.getElementById("p1").value,
      document.getElementById("p2").value,
      document.getElementById("p3").value,
      document.getElementById("p4").value
    ],

    pars:
      [...pars],

    scores:
      scores.map(function(row){
        return [...row];
      }),

    /*
      最後に見ていたホールを保存
      これにより続きから再開できます
    */
    lastHole:
      currentHole,

    savedAt:
      new Date().toISOString()

  };


  saveRounds();

  updateRoundSelect();

  updateRoundInfo();

}


/* ==========================================
   自動保存
========================================== */

function autoSave(){

  if(!currentRoundId){
    return;
  }

  saveCurrentRound();

}


/* ==========================================
   保存ラウンド読み込み
========================================== */

function loadSelectedRound(){

  const id =
    document.getElementById("roundSelect").value;

  if(!id){
    return;
  }

  loadRound(id);

}


/* ==========================================
   ラウンド読み込み
========================================== */

function loadRound(id){

  const r = rounds[id];

  if(!r){
    return;
  }


  currentRoundId = id;


  document.getElementById("course").value =
    r.course || "";

  document.getElementById("date").value =
    r.date || "";


  const players =
    r.players || ["","","",""];

  document.getElementById("p1").value =
    players[0] || "";

  document.getElementById("p2").value =
    players[1] || "";

  document.getElementById("p3").value =
    players[2] || "";

  document.getElementById("p4").value =
    players[3] || "";


  pars =
    Array.isArray(r.pars)
      ? [...r.pars]
      : Array(18).fill(4);


  scores =
    Array.isArray(r.scores)
      ? r.scores.map(function(row){

          const result =
            Array(18).fill(null);

          if(Array.isArray(row)){

            for(let i=0;i<18;i++){

              result[i] =
                row[i] ?? null;

            }

          }

          return result;

        })
      : Array.from(
          {length:4},
          () => Array(18).fill(null)
        );


  /*
    保存時の最後のホールから再開
  */

  currentHole =
    Number.isInteger(r.lastHole)
      ? r.lastHole
      : 0;


  if(currentHole < 0){
    currentHole = 0;
  }

  if(currentHole > 17){
    currentHole = 17;
  }


  createParInputs();

  createPlayerRows();

  updateDisplay();

  updateRoundSelect();

  updateRoundInfo();

  document.getElementById("scoreListCard").style.display =
    "none";

}


/* ==========================================
   ラウンド情報表示
========================================== */

function updateRoundInfo(){

  const r =
    rounds[currentRoundId];

  const info =
    document.getElementById("roundInfo");

  if(!r){
    info.textContent = "";
    return;
  }


  let text = "";

  if(r.course){
    text += r.course;
  }

  if(r.date){

    if(text){
      text += " / ";
    }

    text += r.date;

  }


  info.textContent =
    text || "新規ラウンド";

}


/* ==========================================
   PAR入力欄作成
========================================== */

function createParInputs(){

  const grid =
    document.getElementById("parGrid");

  grid.innerHTML = "";


  for(let i=0;i<18;i++){

    const wrapper =
      document.createElement("div");


    const label =
      document.createElement("label");

    label.textContent =
      (i+1) + "H";


    const input =
      document.createElement("input");

    input.type = "number";

    input.min = "3";

    input.max = "6";

    input.value =
      pars[i];

    input.addEventListener(
      "change",
      function(){

        let value =
          parseInt(this.value,10);

        if(isNaN(value)){
          value = 4;
        }

        if(value < 3){
          value = 3;
        }

        if(value > 6){
          value = 6;
        }

        pars[i] = value;

        this.value = value;

        saveCurrentRound();

        updateDisplay();

      }
    );


    wrapper.appendChild(label);

    wrapper.appendChild(input);

    grid.appendChild(wrapper);

  }

}


/* ==========================================
   プレイヤー行作成
========================================== */

function createPlayerRows(){

  const container =
    document.getElementById("players");

  container.innerHTML = "";


  const names = [

    document.getElementById("p1").value || "Aさん",

    document.getElementById("p2").value || "Bさん",

    document.getElementById("p3").value || "Cさん",

    document.getElementById("p4").value || "Dさん"

  ];


  for(let i=0;i<4;i++){

    const row =
      document.createElement("div");

    row.className =
      "player-row";


    const name =
      document.createElement("div");

    name.className =
      "player-name";

    name.textContent =
      names[i];


    const minus =
      document.createElement("button");

    minus.className =
      "score-button";

    minus.textContent =
      "−";

    minus.onclick = function(){

      changeScore(i,-1);

    };


    const score =
      document.createElement("div");

    score.className =
      "score-number";

    score.id =
      "score-" + i;


    const plus =
      document.createElement("button");

    plus.className =
      "score-button";

    plus.textContent =
      "+";

    plus.onclick = function(){

      changeScore(i,1);

    };


    row.appendChild(name);

    row.appendChild(minus);

    row.appendChild(score);

    row.appendChild(plus);

    container.appendChild(row);

  }


  updatePlayerScores();

}


/* ==========================================
   スコア変更
========================================== */

function changeScore(player,delta){

  let value =
    scores[player][currentHole];


  /*
    まだスコアを変更していない場合は
    そのホールのPARを基準にする
  */

  if(value === null ||
     value === undefined){

    value =
      pars[currentHole];

  }


  value += delta;


  if(value < 1){
    value = 1;
  }

  if(value > 15){
    value = 15;
  }


  scores[player][currentHole] =
    value;


  saveCurrentRound();

  updatePlayerScores();

}


/* ==========================================
   現在ホールのスコア表示
========================================== */

function updatePlayerScores(){

  for(let i=0;i<4;i++){

    const element =
      document.getElementById("score-" + i);

    if(!element){
      continue;
    }


    let value =
      scores[i][currentHole];


    /*
      ここが重要。

      スコアをまだ変更していなくても
      PARを表示する。
    */

    if(value === null ||
       value === undefined){

      value =
        pars[currentHole];

    }


    element.textContent =
      value;

  }

}


/* ==========================================
   ホール表示更新
========================================== */

function updateDisplay(){

  document.getElementById("holeDisplay").textContent =
    (currentHole + 1) + "H";


  document.getElementById("parDisplay").textContent =
    pars[currentHole];


  updatePlayerScores();

  updateRoundInfo();

}


/* ==========================================
   前のホール
========================================== */

function prevHole(){

  if(currentHole > 0){

    currentHole--;

    saveCurrentRound();

    updateDisplay();

  }

}


/* ==========================================
   次のホール
========================================== */

function nextHole(){

  if(currentHole < 17){

    currentHole++;

    saveCurrentRound();

    updateDisplay();

  }

}


/* ==========================================
   スコア取得

   未入力の場合はPARを返す
========================================== */

function getScore(player,hole){

  const value =
    scores[player][hole];

  if(value === null ||
     value === undefined){

    return pars[hole];

  }

  return value;

}


/* ==========================================
   OUT
========================================== */

function getOut(player){

  let total = 0;

  for(let h=0;h<9;h++){

    total +=
      getScore(player,h);

  }

  return total;

}


/* ==========================================
   IN
========================================== */

function getIn(player){

  let total = 0;

  for(let h=9;h<18;h++){

    total +=
      getScore(player,h);

  }

  return total;

}


/* ==========================================
   TOTAL
========================================== */

function getTotal(player){

  return getOut(player) +
         getIn(player);

}


/* ==========================================
   PAR OUT
========================================== */

function getParOut(){

  let total = 0;

  for(let h=0;h<9;h++){

    total +=
      pars[h];

  }

  return total;

}


/* ==========================================
   PAR IN
========================================== */

function getParIn(){

  let total = 0;

  for(let h=9;h<18;h++){

    total +=
      pars[h];

  }

  return total;

}


/* ==========================================
   PAR TOTAL
========================================== */

function getParTotal(){

  return getParOut() +
         getParIn();

}


/* ==========================================
   スコア一覧表示
========================================== */

function showScoreList(){

  const card =
    document.getElementById("scoreListCard");

  card.style.display = "block";


  const head =
    document.getElementById("scoreTableHead");

  const body =
    document.getElementById("scoreTableBody");


  head.innerHTML = "";

  body.innerHTML = "";


  /*
    ヘッダー
  */

  const header =
    document.createElement("tr");


  const headers = [
    "H",
    "PAR",
    document.getElementById("p1").value || "Aさん",
    document.getElementById("p2").value || "Bさん",
    document.getElementById("p3").value || "Cさん",
    document.getElementById("p4").value || "Dさん"
  ];


  headers.forEach(function(text){

    const th =
      document.createElement("th");

    th.textContent =
      text;

    header.appendChild(th);

  });


  head.appendChild(header);


  /*
    1～18H
  */

  for(let h=0;h<18;h++){

    const tr =
      document.createElement("tr");


    /*
      ホール番号
    */

    let td =
      document.createElement("td");

    td.textContent =
      (h+1);

    tr.appendChild(td);


    /*
      PAR
    */

    td =
      document.createElement("td");

    td.textContent =
      pars[h];

    tr.appendChild(td);


    /*
      各プレイヤー

      未入力でもPARを表示
    */

    for(let p=0;p<4;p++){

      td =
        document.createElement("td");

      td.textContent =
        getScore(p,h);

      tr.appendChild(td);

    }


    body.appendChild(tr);

  }


  /*
    OUT
  */

  let tr =
    document.createElement("tr");

  tr.className =
    "total-row";


  td =
    document.createElement("td");

  td.textContent =
    "OUT";

  tr.appendChild(td);


  td =
    document.createElement("td");

  td.textContent =
    getParOut();

  tr.appendChild(td);


  for(let p=0;p<4;p++){

    td =
      document.createElement("td");

    td.textContent =
      getOut(p);

    tr.appendChild(td);

  }


  body.appendChild(tr);


  /*
    IN
  */

  tr =
    document.createElement("tr");

  tr.className =
    "total-row";


  td =
    document.createElement("td");

  td.textContent =
    "IN";

  tr.appendChild(td);


  td =
    document.createElement("td");

  td.textContent =
    getParIn();

  tr.appendChild(td);


  for(let p=0;p<4;p++){

    td =
      document.createElement("td");

    td.textContent =
      getIn(p);

    tr.appendChild(td);

  }


  body.appendChild(tr);


  /*
    TOTAL
  */

  tr =
    document.createElement("tr");

  tr.className =
    "total-row";


  td =
    document.createElement("td");

  td.textContent =
    "TOTAL";

  tr.appendChild(td);


  td =
    document.createElement("td");

  td.textContent =
    getParTotal();

  tr.appendChild(td);


  for(let p=0;p<4;p++){

    td =
      document.createElement("td");

    td.textContent =
      getTotal(p);

    tr.appendChild(td);

  }


  body.appendChild(tr);


  /*
    一覧までスクロール
  */

  card.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}
