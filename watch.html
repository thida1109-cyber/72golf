<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>72ゴルフ Watch</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-align:center;
  overflow:hidden;
}

.app{
  width:100%;
  max-width:360px;
  height:100vh;
  margin:auto;
  padding:8px 10px 10px;
  display:flex;
  flex-direction:column;
}

/* ホール表示 */
.hole{
  font-size:25px;
  font-weight:bold;
  line-height:1.1;
}

.par{
  font-size:16px;
  margin-top:2px;
  color:#ddd;
}

/* 人名 */
.player-name{
  font-size:27px;
  font-weight:bold;
  margin:8px 0 4px;
}

/* 項目 */
.label{
  font-size:15px;
  color:#bbb;
  margin-top:2px;
}

/* 打数・PAT */
.score-area{
  display:grid;
  grid-template-columns:72px 1fr 72px;
  align-items:center;
  gap:8px;
  margin-top:3px;
}

.value{
  font-size:42px;
  font-weight:bold;
  line-height:1;
}

.big-btn{
  width:72px;
  height:58px;
  border:1px solid #777;
  border-radius:14px;
  background:#222;
  color:#fff;
  font-size:34px;
  font-weight:bold;
  padding:0;
}

.big-btn:active{
  background:#666;
}

/* 累計 */
.total{
  margin-top:10px;
  padding-top:7px;
  border-top:1px solid #444;
  font-size:18px;
}

.total-value{
  font-size:27px;
  font-weight:bold;
  margin-left:8px;
}

/* スワイプ案内 */
.swipe{
  margin-top:auto;
  padding-top:5px;
  font-size:11px;
  color:#888;
  line-height:1.5;
}

.hint{
  font-size:10px;
  color:#666;
}

/* 画面下の現在位置 */
.position{
  font-size:10px;
  color:#666;
  margin-top:2px;
}
</style>

</head>

<body>

<div class="app" id="app">

  <div class="hole">
    <span id="hole">1</span>番
  </div>

  <div class="par">
    PAR <span id="par">4</span>
  </div>

  <div class="player-name" id="playerName">
    武田
  </div>

  <!-- 打数 -->

  <div class="label">打数</div>

  <div class="score-area">
    <button class="big-btn"
            onclick="changeScore(-1)">−</button>

            onclick="changePat(-1)">−</button>

<button class="big-btn"
