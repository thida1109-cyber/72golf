<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>72ゴルフ Watch</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#f4f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center}
#app{width:100%;max-width:340px;padding:8px}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.row{display:flex;align-items:center;margin:5px 0;min-height:40px}
.hole{width:48px;font-weight:bold}
.par{width:64px;text-align:center;font-weight:bold}
.name{flex:1;text-align:right;font-weight:bold;overflow:hidden;white-space:nowrap}
.score-label,.pat-label{width:64px;font-weight:bold}
.minus,.plus{width:58px;height:42px;padding:0;font-size:27px;font-weight:bold;border:1px solid #aaa;border-radius:8px;background:#fff}
.value{width:46px;text-align:center;font-size:21px;font-weight:bold}
.total-label{font-weight:bold;width:82px}
.total{font-size:21px;font-weight:bold}
#status{text-align:center;font-size:11px;color:#666;margin-top:5px}
#back{display:block;text-align:center;margin-top:7px;font-size:12px}
</style>
</head>
<body>
<div id="app">
<div class="card">
<div class="row"><div class="hole"><span id="holeNo">1</span>番</div><div class="par">PAR <span id="par">4</span></div><div class="name" id="name">武田</div></div>
<div class="row"><div class="score-label">打数</div><button class="minus" onclick="changeScore(-1)">−</button><div class="value" id="score">4</div><button class="plus" onclick="changeScore(1)">＋</button></div>
<div class="row" id="patRow"><div class="pat-label">PAT数</div><button class="minus" onclick="changePat(-1)">−</button><div class="value" id="pat">2</div><button class="plus" onclick="changePat(1)">＋</button></div>
<div class="row"><div class="total-label">合計打数</div><div class="total" id="total">4</div></div>
<div id="status">INDEXデータを読み込み中</div>
</div>
<a id="back" href="index.html">INDEXへ戻る</a>
</div>
<script>
const KEY="72golf_watch_bridge_v1";
let data=null,round=null,person=0,hole=0;

function load(){
  try{data=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){data=null}
  if(!data||!data.round){document.getElementById("status").textContent="INDEXデータがありません";return}
  round=data.round;
  hole=Number.isInteger(round.lastHole)?round.lastHole:0;
  if(!Array.isArray(round.scores)||round.scores.length<4) round.scores=Array.from({length:4},()=>Array(18).fill(null));
  if(!Array.isArray(round.pats)||round.pats.length!==18) round.pats=Array(18).fill(2);
  render();
}
function score(){
  const v=round.scores[person][hole];
  return v==null?Number(round.pars[hole]||4):Number(v);
}
function pat(){return round.pats[hole]==null?2:Number(round.pats[hole])}
function total(){
  let t=0;
  for(let h=0;h<=hole;h++){
    const v=round.scores[person][h];
    t+=v==null?Number(round.pars[h]||4):Number(v);
  }
  return t;
}
function render(){
  document.getElementById("holeNo").textContent=hole+1;
  document.getElementById("par").textContent=round.pars[hole]||4;
  document.getElementById("name").textContent=(round.players&&round.players[person])||["Aさん","Bさん","Cさん","Dさん"][person];
  document.getElementById("score").textContent=score();
  document.getElementById("total").textContent=total();
  document.getElementById("patRow").style.display=person===0?"flex":"none";
  if(person===0) document.getElementById("pat").textContent=pat();
  document.getElementById("status").textContent="Watchで変更 → INDEXへ書き戻し";
}
function writeBack(){
  round.lastHole=hole;
  localStorage.setItem(KEY,JSON.stringify({version:Date.now(),round:round}));
}
function changeScore(d){
  round.scores[person][hole]=Math.max(1,Math.min(12,score()+d));
  writeBack();render();
}
function changePat(d){
  round.pats[hole]=Math.max(0,Math.min(10,pat()+d));
  writeBack();render();
}
let sx=0,sy=0;
document.addEventListener("touchstart",e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<35)return;
  if(Math.abs(dx)>Math.abs(dy)){if(dx<0&&hole<17)hole++;if(dx>0&&hole>0)hole--}
  else{if(dy<0&&person<3)person++;if(dy>0&&person>0)person--}
  writeBack();render();
});
load();
</script>
</body>
</html>
