<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,
      maximum-scale=1,user-scalable=no">

<title>72ゴルフ Watch</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",sans-serif;
  overflow:hidden;
}

#screen{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  touch-action:none;
}

.page{
  width:100%;
  max-width:380px;
  padding:8px 7px 4px;
  text-align:center;
}

.header{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:bold;
}

.hole{
  font-size:30px;
}

.par{
  font-size:21px;
}

.person{
  font-size:28px;
  min-width:75px;
  max-width:100px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.input-row{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.label{
  width:58px;
  text-align:left;
  font-size:18px;
  font-weight:bold;
}

.button{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border:1px solid #777;
  border-radius:12px;
  background:#222;
  color:#fff;
  font-size:32px;
  font-weight:bold;
  padding:0;
}

.button:active{
  background:#555;
}

.number{
  width:52px;
  flex:0 0 52px;
  text-align:center;
  font-size:31px;
  font-weight:bold;
}

.total{
  height:52px;
  margin-top:3px;
  border-top:1px solid #444;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:18px;
  font-weight:bold;
}

.total-number{
  font-size:30px;
}

.status{
  margin-top:5px;
  font-size:10px;
  color:#aaa;
  min-height:13px;
  line-height:13px;
  white-space:pre-line;
}

.help{
  margin-top:4px;
  font-size:9px;
  color:#666;
}
</style>
</head>

<body>

<div id="screen"></div>

<script>

/* =========================================
   Supabase設定
========================================= */

const SUPABASE_URL =
  "https://qujiuvxikrmphvfunngn.supabase.co";

const SUPABASE_TABLE =
  "rounds";

const KEY_STORE =
  "72golf_watch_supabase_key";


let key =
  localStorage.getItem(KEY_STORE) || "";


/* =========================================
   ゴルフデータ
========================================= */

let roundId = null;

let pars = [
  4,4,3,5,4,4,3,4,5,
  4,4,3,5,4,4,3,4,5
];

let names = [
  "武田",
  "Aさん",
  "Bさん",
  "Cさん"
];

let scores =
  Array.from(
    {length:4},
    () => Array(18).fill(null)
  );

let pats =
  Array(18).fill(2);

let person = 0;

let hole = 0;

let status = "";

let lastCloudData = "";

let loading = false;


/* =========================================
   Supabaseキー入力
========================================= */

function askKey(force=false){

  if(key && !force){
    return true;
  }

  const k = prompt(
    "72ゴルフWatchをSupabaseに接続します。\n\n" +
    "Supabaseの「Publishable key」を入力してください。\n\n" +
    "※ Secret keyは絶対に入力しないでください。\n" +
    "※ iPhoneに入力したものと同じキーです。",
    key || ""
  );

  if(!k){
    status = "Supabaseキー未設定";
    render();
    return false;
  }

  key = k.trim();

  if(!key){
    status = "Supabaseキー未設定";
    render();
    return false;
  }

  localStorage.setItem(
    KEY_STORE,
    key
  );

  return true;
}


/* =========================================
   Supabase通信
========================================= */

async function supabaseRequest(
  path,
  options={}
){

  if(!askKey()){
    throw new Error(
      "Supabaseキーが設定されていません。"
    );
  }

  const res =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      path,
      {
        ...options,

        headers:{
          "apikey":key,
          "Authorization":"Bearer "+key,
          "Content-Type":"application/json",
          ...(options.headers || {})
        }
      }
    );

  const text =
    await res.text();

  if(!res.ok){

    throw new Error(
      "HTTP " +
      res.status +
      "\n" +
      text
    );
  }

  return text
    ? JSON.parse(text)
    : null;
}


/* =========================================
   最新データ取得
========================================= */

async function getLatest(){

  if(loading){
    return;
  }

  loading = true;

  try{

    status =
      "iPhoneデータを読込中…";

    render();


    let data;

    try{

      data =
        await supabaseRequest(
          SUPABASE_TABLE +
          "?select=*&order=id.desc&limit=1"
        );

    }catch(e){

      /*
        401 / 403なら
        古いキーの可能性があるため
        もう一度キーを入力
      */

      if(
        String(e.message).includes("HTTP 401") ||
        String(e.message).includes("HTTP 403")
      ){

        key = "";

        localStorage.removeItem(
          KEY_STORE
        );

        status =
          "Supabaseキーを再入力してください";

        render();

        if(!askKey(true)){
          loading=false;
          return;
        }

        data =
          await supabaseRequest(
            SUPABASE_TABLE +
            "?select=*&order=id.desc&limit=1"
          );

      }else{

        throw e;
      }
    }


    if(
      !data ||
      !Array.isArray(data) ||
      data.length===0
    ){

      status =
        "Supabaseに保存データがありません";

      render();

      loading=false;

      return;
    }


    const d = data[0];


    const newData =
      JSON.stringify({
        id:d.id,
        players_name:d.players_name,
        pars:d.pars,
        scores:d.scores,
        pats:d.pats,
        last_hole:d.last_hole
      });


    /*
      同じデータなら
      画面を書き換えない
    */

    if(
      newData === lastCloudData
    ){

      loading=false;
      return;
    }


    lastCloudData =
      newData;


    /* ラウンドID */

    roundId =
      Number(d.id);


    /* PAR */

    if(
      Array.isArray(d.pars) &&
      d.pars.length === 18
    ){

      pars =
        d.pars.map(
          v => Number(v)
        );
    }


    /* 名前 */

    if(
      Array.isArray(d.players_name) &&
      d.players_name.length === 4
    ){

      names =
        d.players_name.map(
          (v,i) =>
            v ||
            [
              "武田",
              "Aさん",
              "Bさん",
              "Cさん"
            ][i]
        );
    }


    /* スコア */

    if(
      Array.isArray(d.scores) &&
      d.scores.length === 4
    ){

      scores =
        d.scores.map(
          row => {

            const a =
              Array(18).fill(null);

            if(Array.isArray(row)){

              for(
                let i=0;
                i<18;
                i++
              ){

                a[i] =
                  row[i] == null
                    ? null
                    : Number(row[i]);
              }
            }

            return a;
          }
        );
    }


    /* PAT */

    if(
      Array.isArray(d.pats) &&
      d.pats.length === 18
    ){

      pats =
        d.pats.map(
          v =>
            v == null
              ? 2
              : Number(v)
        );
    }


    /* 現在ホール */

    if(
      d.last_hole !== undefined &&
      d.last_hole !== null
    ){

      hole =
        Math.max(
          0,
          Math.min(
            17,
            Number(d.last_hole) || 0
          )
        );
    }


    /*
      iPhoneから新しいデータを
      受信したら武田さんを表示
    */

    person = 0;


    saveLocal();


    status =
      "iPhoneデータ：更新済";


    render();

  }catch(e){

    console.error(e);

    status =
      "読込失敗\n" +
      e.message;

    render();

  }finally{

    loading=false;
  }
}


/* =========================================
   Watch → Supabase
========================================= */

async function saveToCloud(){

  if(roundId === null){

    status =
      "iPhoneデータ未取得";

    render();

    return false;
  }


  try{

    status =
      "Watchデータを保存中…";

    render();


    const body = {

      players_name:
        [...names],

      pars:
        [...pars],

      scores:
        scores.map(
          row => [...row]
        ),

      pats:
        [...pats],

      last_hole:
        Number(hole)
    };


    await supabaseRequest(

      SUPABASE_TABLE +
      "?id=eq." +
      encodeURIComponent(roundId),

      {

        method:"PATCH",

        headers:{
          "Prefer":
            "return=minimal"
        },

        body:
          JSON.stringify(body)
      }
    );


    status =
      "クラウド保存済";

    return true;

  }catch(e){

    console.error(e);

    status =
      "保存失敗\n" +
      e.message;

    render();

    return false;
  }
}


/* =========================================
   ローカル保存
========================================= */

function saveLocal(){

  try{

    localStorage.setItem(
      "72golf_watch_data",

      JSON.stringify({

        roundId,
        pars,
        names,
        scores,
        pats,
        person,
        hole

      })
    );

  }catch(e){}
}


/* =========================================
   ローカル読込
========================================= */

function loadLocal(){

  try{

    const d =
      JSON.parse(
        localStorage.getItem(
          "72golf_watch_data"
        ) || "null"
      );

    if(!d){
      return;
    }


    if(
      d.roundId !== undefined
    ){
      roundId=d.roundId;
    }


    if(
      Array.isArray(d.pars)
    ){
      pars=d.pars;
    }


    if(
      Array.isArray(d.names)
    ){
      names=d.names;
    }


    if(
      Array.isArray(d.scores)
    ){
      scores=d.scores;
    }


    if(
      Array.isArray(d.pats)
    ){
      pats=d.pats;
    }


    if(
      Number.isInteger(d.person)
    ){
      person=d.person;
    }


    if(
      Number.isInteger(d.hole)
    ){
      hole=d.hole;
    }

  }catch(e){}
}


/* =========================================
   現在の打数
========================================= */

function getScore(){

  const v =
    scores[person][hole];

  if(
    v === null ||
    v === undefined
  ){

    return pars[hole];
  }

  return Number(v);
}


/* =========================================
   現在ホールまでの合計
========================================= */

function getTotal(){

  let total = 0;

  for(
    let i=0;
    i<=hole;
    i++
  ){

    const v =
      scores[person][i];

    total +=
      v === null ||
      v === undefined
        ? pars[i]
        : Number(v);
  }

  return total;
}


/* =========================================
   打数変更
========================================= */

async function changeScore(delta){

  scores[person][hole] =
    Math.max(
      1,
      Math.min(
        12,
        getScore()+delta
      )
    );


  saveLocal();

  render();


  await saveToCloud();
}


/* =========================================
   PAT変更
========================================= */

async function changePat(delta){

  /*
    PATは武田さんだけ
  */

  if(person !== 0){
    return;
  }


  pats[hole] =
    Math.max(
      0,
      Math.min(
        10,
        Number(pats[hole]) + delta
      )
    );


  saveLocal();

  render();


  await saveToCloud();
}


/* =========================================
   Watch画面表示
========================================= */

function render(){

  const isTakeda =
    person === 0;


  const patHtml =
    isTakeda

    ?

`
<div class="input-row">

  <div class="label">
    PAT数
  </div>

  <button
    class="button"
    id="patMinus">
    −
  </button>

  <div class="number">
    ${pats[hole]}
  </div>

  <button
    class="button"
    id="patPlus">
    ＋
  </button>

</div>
`

    :

    "";


  document.getElementById(
    "screen"
  ).innerHTML =

`
<div class="page">

  <div class="header">

    <div class="hole">
      ${hole+1}番
    </div>

    <div class="par">
      PAR ${pars[hole]}
    </div>

    <div class="person">
      ${names[person]}
    </div>

  </div>


  <div class="input-row">

    <div class="label">
      打数
    </div>

    <button
      class="button"
      id="scoreMinus">
      −
    </button>

    <div class="number">
      ${getScore()}
    </div>

    <button
      class="button"
      id="scorePlus">
      ＋
    </button>

  </div>


  ${patHtml}


  <div class="total">

    <span>
      合計打数
    </span>

    <span class="total-number">
      ${getTotal()}
    </span>

  </div>


  <div class="status">
    ${status || "自動保存"}
  </div>


  <div class="help">
    ↑↓ 人　← 次ホール　→ 前ホール
  </div>

</div>
`;


  document.getElementById(
    "scoreMinus"
  ).onclick =
    () => changeScore(-1);


  document.getElementById(
    "scorePlus"
  ).onclick =
    () => changeScore(1);


  if(isTakeda){

    document.getElementById(
      "patMinus"
    ).onclick =
      () => changePat(-1);


    document.getElementById(
      "patPlus"
    ).onclick =
      () => changePat(1);
  }
}


/* =========================================
   スワイプ操作
========================================= */

let startX = 0;
let startY = 0;


document.addEventListener(
  "touchstart",

  function(e){

    if(
      e.touches.length !== 1
    ){
      return;
    }

    startX =
      e.touches[0].clientX;

    startY =
      e.touches[0].clientY;

  },

  {passive:true}
);


document.addEventListener(
  "touchend",

  async function(e){

    if(
      e.changedTouches.length !== 1
    ){
      return;
    }


    const endX =
      e.changedTouches[0].clientX;

    const endY =
      e.changedTouches[0].clientY;


    const dx =
      endX - startX;

    const dy =
      endY - startY;


    /*
      小さな動きは無視
    */

    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      ) < 45
    ){
      return;
    }


    /*
      左右スワイプ
    */

    if(
      Math.abs(dx) >
      Math.abs(dy)
    ){

      /*
        左 → 次ホール
      */

      if(
        dx < 0 &&
        hole < 17
      ){

        hole++;
      }


      /*
        右 → 前ホール
      */

      else if(
        dx > 0 &&
        hole > 0
      ){

        hole--;
      }

    }


    /*
      上下スワイプ
    */

    else{

      /*
        上 → 次の人
      */

      if(
        dy < 0 &&
        person < 3
      ){

        person++;
      }


      /*
        下 → 前の人
      */

      else if(
        dy > 0 &&
        person > 0
      ){

        person--;
      }
    }


    saveLocal();

    render();


    /*
      現在ホールも保存
    */

    await saveToCloud();

  },

  {passive:true}
);


/* =========================================
   起動
========================================= */

loadLocal();

render();


/*
  Supabaseから最新データを取得
*/

setTimeout(
  function(){

    getLatest();

  },
  300
);


/*
  3秒ごとに確認
*/

setInterval(
  function(){

    getLatest();

  },
  3000
);

</script>

</body>
</html>
