<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,
      maximum-scale=1,user-scalable=no">

<title>72ゴルフ Watch</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",sans-serif;
  overflow:hidden;
}

#screen{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  touch-action:none;
}

.page{
  width:100%;
  max-width:380px;
  padding:6px 7px 3px;
  text-align:center;
}

.header{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:bold;
}

.hole{
  font-size:30px;
}

.par{
  font-size:21px;
}

.person{
  font-size:28px;
  min-width:75px;
  max-width:105px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.input-row{
  height:67px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.label{
  width:58px;
  text-align:left;
  font-size:18px;
  font-weight:bold;
}

.button{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border:1px solid #777;
  border-radius:12px;
  background:#222;
  color:#fff;
  font-size:32px;
  font-weight:bold;
  padding:0;
}

.button:active{
  background:#555;
}

.number{
  width:52px;
  flex:0 0 52px;
  text-align:center;
  font-size:31px;
  font-weight:bold;
}

.total{
  height:50px;
  margin-top:2px;
  border-top:1px solid #444;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:18px;
  font-weight:bold;
}

.total-number{
  font-size:30px;
}

.status{
  margin-top:4px;
  font-size:18px;
  color:#fff;
  font-weight:bold;
  min-height:22px;
  line-height:21px;
  white-space:pre-line;
  overflow:hidden;
}

.help{
  margin-top:3px;
  font-size:13px;
  color:#aaa;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="screen"></div>

<script>

/* ==================================================
   Supabase設定
================================================== */

const SUPABASE_URL =
  "https://qujiuvxikrmphvfunngn.supabase.co";

const SUPABASE_TABLE =
  "rounds";

const KEY_STORE =
  "72golf_watch_supabase_key";

const LOCAL_STORE =
  "72golf_watch_data";


let key =
  localStorage.getItem(KEY_STORE) || "";


/* ==================================================
   ゴルフデータ
================================================== */

let roundId = null;

let courseName = "";

let pars = Array(18).fill(4);

let names = [];

let scores = [];

let pats = [];

let person = 0;

let hole = 0;

let status = "起動中…";

let lastCloudData = "";

let loading = false;

let localChange = false;


/* ==================================================
   初期データ作成
================================================== */

function makeDefaultData(){

  if(!names.length){

    names = [
      "武田",
      "Aさん",
      "Bさん",
      "Cさん"
    ];
  }

  if(!pars.length){

    pars = [
      4,4,3,5,4,4,3,4,5,
      4,4,3,5,4,4,3,4,5
    ];
  }

  while(scores.length < names.length){

    scores.push(
      Array(18).fill(null)
    );
  }

  while(pats.length < names.length){

    pats.push(
      Array(18).fill(2)
    );
  }

  for(let p=0;p<names.length;p++){

    if(!Array.isArray(scores[p])){

      scores[p] =
        Array(18).fill(null);
    }

    if(!Array.isArray(pats[p])){

      pats[p] =
        Array(18).fill(2);
    }

    while(scores[p].length < 18){

      scores[p].push(null);
    }

    while(pats[p].length < 18){

      pats[p].push(2);
    }
  }
}


/* ==================================================
   Supabaseキー入力
================================================== */

function askKey(force=false){

  if(key && !force){

    return true;
  }

  const k = prompt(

    "72ゴルフWatchをSupabaseに接続します。\n\n" +

    "Supabaseの「Publishable key」を入力してください。\n\n" +

    "※ Secret keyは入力しないでください。\n" +

    "※ iPhoneに入力したものと同じキーです。",

    key || ""

  );


  if(!k){

    key = "";

    localStorage.removeItem(
      KEY_STORE
    );

    status =
      "Supabaseキー未設定";

    render();

    return false;
  }


  key =
    k.trim();


  if(!key){

    status =
      "Supabaseキー未設定";

    render();

    return false;
  }


  localStorage.setItem(
    KEY_STORE,
    key
  );


  status =
    "キー設定済み・読込中…";

  render();

  return true;
}


/* ==================================================
   Supabase通信
================================================== */

async function supabaseRequest(
  path,
  options={}
){

  if(!key){

    throw new Error(
      "Supabaseキー未設定"
    );
  }


  const headers = {

    "apikey":key,

    "Authorization":
      "Bearer " + key,

    "Content-Type":
      "application/json",

    ...(options.headers || {})
  };


  const res =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/" +
      path,

      {
        ...options,
        headers
      }
    );


  const text =
    await res.text();


  if(!res.ok){

    const err =
      new Error(
        "HTTP " +
        res.status +
        "\n" +
        text
      );

    err.status =
      res.status;

    throw err;
  }


  if(!text){

    return null;
  }


  return JSON.parse(text);
}


/* ==================================================
   SupabaseデータをWatch用に整理
================================================== */

function applyCloudData(d){

  roundId =
    Number(d.id);


  courseName =
    d.course_name ||
    "";


  /* -------------------------------
     PAR
  -------------------------------- */

  if(
    Array.isArray(d.pars) &&
    d.pars.length
  ){

    pars =
      d.pars.map(
        v => Number(v) || 4
      );
  }


  while(pars.length < 18){

    pars.push(4);
  }


  if(pars.length > 18){

    pars =
      pars.slice(0,18);
  }


  /* -------------------------------
     名前
  -------------------------------- */

  if(
    Array.isArray(d.players_name) &&
    d.players_name.length
  ){

    names =
      d.players_name.map(
        v => String(v || "")
      );
  }


  /* -------------------------------
     人数がいない場合
  -------------------------------- */

  if(!names.length){

    names = [
      "武田",
      "Aさん",
      "Bさん",
      "Cさん"
    ];
  }


  /* -------------------------------
     スコア
  -------------------------------- */

  const cloudScores =
    Array.isArray(d.scores)
      ? d.scores
      : [];


  scores = [];


  for(
    let p=0;
    p<names.length;
    p++
  ){

    const row =
      Array.isArray(cloudScores[p])
        ? cloudScores[p]
        : [];


    const newRow =
      Array(18).fill(null);


    for(
      let h=0;
      h<18;
      h++
    ){

      if(
        row[h] !== null &&
        row[h] !== undefined &&
        row[h] !== ""
      ){

        newRow[h] =
          Number(row[h]);
      }
    }


    scores.push(newRow);
  }


  /* -------------------------------
     PAT
     
     iPhone側が
     [人][ホール]
     
     Watch側も
     [人][ホール]
     に統一
  -------------------------------- */

  const cloudPats =
    Array.isArray(d.pats)
      ? d.pats
      : [];


  pats = [];


  for(
    let p=0;
    p<names.length;
    p++
  ){

    const newPat =
      Array(18).fill(2);


    /*
      iPhone側が2次元の場合
    */

    if(
      Array.isArray(cloudPats[p])
    ){

      for(
        let h=0;
        h<18;
        h++
      ){

        if(
          cloudPats[p][h] !== null &&
          cloudPats[p][h] !== undefined &&
          cloudPats[p][h] !== ""
        ){

          newPat[h] =
            Number(cloudPats[p][h]);
        }
      }
    }

    /*
      旧データが1次元の場合
      武田さんのPATとして利用
    */

    else if(
      p === 0 &&
      cloudPats.length === 18
    ){

      for(
        let h=0;
        h<18;
        h++
      ){

        if(
          cloudPats[h] !== null &&
          cloudPats[h] !== undefined
        ){

          newPat[h] =
            Number(cloudPats[h]);
        }
      }
    }


    pats.push(newPat);
  }


  /* -------------------------------
     現在ホール
  -------------------------------- */

  if(
    d.last_hole !== null &&
    d.last_hole !== undefined
  ){

    hole =
      Number(d.last_hole) || 0;
  }


  hole =
    Math.max(
      0,
      Math.min(
        17,
        hole
      )
    );


  /* -------------------------------
     人を武田さんに戻す
  -------------------------------- */

  person = 0;


  makeDefaultData();
}


/* ==================================================
   最新データ取得
================================================== */

async function getLatest(){

  if(loading){

    return;
  }


  if(!askKey()){

    return;
  }


  loading = true;


  try{

    status =
      "iPhoneデータを読込中…";

    render();


    let data;


    try{

      data =
        await supabaseRequest(

          SUPABASE_TABLE +
          "?select=*&order=id.desc&limit=1",

          {
            method:"GET"
          }

        );

    }catch(e){

      /*
        401 / 403
        → キー再入力
      */

      if(
        e.status === 401 ||
        e.status === 403
      ){

        key = "";

        localStorage.removeItem(
          KEY_STORE
        );


        status =
          "キーを再入力してください";

        render();


        if(!askKey(true)){

          loading=false;

          return;
        }


        data =
          await supabaseRequest(

            SUPABASE_TABLE +
            "?select=*&order=id.desc&limit=1",

            {
              method:"GET"
            }

          );

      }else{

        throw e;
      }
    }


    if(
      !Array.isArray(data) ||
      data.length === 0
    ){

      status =
        "Supabaseにデータがありません";

      render();

      loading=false;

      return;
    }


    const d =
      data[0];


    /*
      最新データそのものを比較
    */

    const cloudString =
      JSON.stringify(d);


    /*
      Watch側で直前に変更した直後は
      同じデータを再読込しない
    */

    if(
      cloudString === lastCloudData &&
      !localChange
    ){

      status =
        "iPhoneデータ：確認済";

      render();

      loading=false;

      return;
    }


    lastCloudData =
      cloudString;


    localChange = false;


    applyCloudData(d);


    saveLocal();


    status =
      "iPhoneデータ：更新済";


    render();


  }catch(e){

    console.error(e);


    status =
      "読込失敗\n" +
      e.message;


    render();


  }finally{

    loading=false;
  }
}


/* ==================================================
   Watch → Supabase保存
================================================== */

async function saveToCloud(){

  if(roundId === null){

    status =
      "iPhoneデータ未取得";

    render();

    return false;
  }


  try{

    status =
      "クラウド保存中…";

    render();


    const body = {

      players_name:
        names.map(
          v => String(v)
        ),

      pars:
        pars.map(
          v => Number(v)
        ),

      scores:
        scores.map(
          row =>
            row.map(
              v =>
                v === null
                  ? null
                  : Number(v)
            )
        ),

      /*
        iPhone側と合わせて
        人×ホールの2次元
      */

      pats:
        pats.map(
          row =>
            row.map(
              v => Number(v)
            )
        ),

      last_hole:
        Number(hole)
    };


    await supabaseRequest(

      SUPABASE_TABLE +
      "?id=eq." +
      encodeURIComponent(
        roundId
      ),

      {

        method:"PATCH",

        headers:{
          "Prefer":
            "return=minimal"
        },

        body:
          JSON.stringify(body)
      }

    );


    /*
      保存したデータを
      最新クラウドデータとして記録
    */

    lastCloudData =
      JSON.stringify({

        id:roundId,

        players_name:
          body.players_name,

        pars:
          body.pars,

        scores:
          body.scores,

        pats:
          body.pats,

        last_hole:
          body.last_hole
      });


    localChange = true;


    saveLocal();


    status =
      "クラウド保存済";


    render();


    return true;


  }catch(e){

    console.error(e);


    status =
      "保存失敗\n" +
      e.message;


    render();


    return false;
  }
}


/* ==================================================
   ローカル保存
================================================== */

function saveLocal(){

  try{

    localStorage.setItem(

      LOCAL_STORE,

      JSON.stringify({

        roundId,

        courseName,

        pars,

        names,

        scores,

        pats,

        person,

        hole

      })

    );

  }catch(e){

    console.error(e);
  }
}


/* ==================================================
   ローカル読込
================================================== */

function loadLocal(){

  try{

    const raw =
      localStorage.getItem(
        LOCAL_STORE
      );


    if(!raw){

      makeDefaultData();

      return;
    }


    const d =
      JSON.parse(raw);


    if(
      d.roundId !== undefined &&
      d.roundId !== null
    ){

      roundId =
        d.roundId;
    }


    if(
      typeof d.courseName === "string"
    ){

      courseName =
        d.courseName;
    }


    if(
      Array.isArray(d.pars)
    ){

      pars =
        d.pars;
    }


    if(
      Array.isArray(d.names)
    ){

      names =
        d.names;
    }


    if(
      Array.isArray(d.scores)
    ){

      scores =
        d.scores;
    }


    if(
      Array.isArray(d.pats)
    ){

      pats =
        d.pats;
    }


    if(
      Number.isInteger(d.person)
    ){

      person =
        d.person;
    }


    if(
      Number.isInteger(d.hole)
    ){

      hole =
        d.hole;
    }


    makeDefaultData();


    person =
      Math.max(
        0,
        Math.min(
          names.length-1,
          person
        )
      );


    hole =
      Math.max(
        0,
        Math.min(
          17,
          hole
        )
      );


  }catch(e){

    console.error(e);

    makeDefaultData();
  }
}


/* ==================================================
   現在の打数
================================================== */

function getScore(){

  makeDefaultData();


  let v =
    scores[person][hole];


  if(
    v === null ||
    v === undefined ||
    isNaN(Number(v))
  ){

    return Number(
      pars[hole] || 4
    );
  }


  return Number(v);
}


/* ==================================================
   現在のPAT
================================================== */

function getPat(){

  makeDefaultData();


  let v =
    pats[person][hole];


  if(
    v === null ||
    v === undefined ||
    isNaN(Number(v))
  ){

    return 2;
  }


  return Number(v);
}


/* ==================================================
   合計打数
================================================== */

function getTotal(){

  let total = 0;


  for(
    let h=0;
    h<=hole;
    h++
  ){

    const v =
      scores[person][h];


    if(
      v === null ||
      v === undefined ||
      isNaN(Number(v))
    ){

      total +=
        Number(
          pars[h] || 4
        );

    }else{

      total +=
        Number(v);
    }
  }


  return total;
}


/* ==================================================
   打数変更
================================================== */

async function changeScore(delta){

  makeDefaultData();


  let value =
    getScore() + delta;


  value =
    Math.max(
      1,
      Math.min(
        12,
        value
      )
    );


  scores[person][hole] =
    value;


  localChange = true;


  saveLocal();

  render();


  await saveToCloud();
}


/* ==================================================
   PAT変更
================================================== */

async function changePat(delta){

  /*
    武田さんだけ
  */

  if(person !== 0){

    return;
  }


  makeDefaultData();


  let value =
    getPat() + delta;


  value =
    Math.max(
      0,
      Math.min(
        10,
        value
      )
    );


  pats[person][hole] =
    value;


  localChange = true;


  saveLocal();

  render();


  await saveToCloud();
}


/* ==================================================
   Watch画面
================================================== */

function render(){

  makeDefaultData();


  if(
    person < 0 ||
    person >= names.length
  ){

    person = 0;
  }


  if(
    hole < 0 ||
    hole >= 18
  ){

    hole = 0;
  }


  const currentName =
    names[person] || "---";


  const currentPar =
    pars[hole] || 4;


  const currentScore =
    getScore();


  const currentPat =
    getPat();


  const total =
    getTotal();


  const patHtml =

    person === 0

    ?

`
<div class="input-row">

  <div class="label">
    PAT
  </div>

  <button
    class="button"
    id="patMinus">
    −
  </button>

  <div class="number">
    ${currentPat}
  </div>

  <button
    class="button"
    id="patPlus">
    ＋
  </button>

</div>
`

    :

    "";


  document.getElementById(
    "screen"
  ).innerHTML =

`
<div class="page">

  <div class="header">

    <div class="hole">
      ${hole+1}番
    </div>

    <div class="par">
      PAR ${currentPar}
    </div>

    <div class="person">
      ${currentName}
    </div>

  </div>


  <div class="input-row">

    <div class="label">
      打数
    </div>

    <button
      class="button"
      id="scoreMinus">
      −
    </button>

    <div class="number">
      ${currentScore}
    </div>

    <button
      class="button"
      id="scorePlus">
      ＋
    </button>

  </div>


  ${patHtml}


  <div class="total">

    <span>
      合計打数
    </span>

    <span class="total-number">
      ${total}
    </span>

  </div>


  <div class="status">
    ${status || "自動保存"}
  </div>


  <div class="help">
    上下：人　　←：次ホール　→：前ホール
  </div>

</div>
`;


  const scoreMinus =
    document.getElementById(
      "scoreMinus"
    );


  const scorePlus =
    document.getElementById(
      "scorePlus"
    );


  if(scoreMinus){

    scoreMinus.onclick =
      () => changeScore(-1);
  }


  if(scorePlus){

    scorePlus.onclick =
      () => changeScore(1);
  }


  if(person === 0){

    const patMinus =
      document.getElementById(
        "patMinus"
      );


    const patPlus =
      document.getElementById(
        "patPlus"
      );


    if(patMinus){

      patMinus.onclick =
        () => changePat(-1);
    }


    if(patPlus){

      patPlus.onclick =
        () => changePat(1);
    }
  }
}


/* ==================================================
   スワイプ
================================================== */

let startX = 0;

let startY = 0;


document.addEventListener(

  "touchstart",

  function(e){

    if(
      e.touches.length !== 1
    ){

      return;
    }


    startX =
      e.touches[0].clientX;


    startY =
      e.touches[0].clientY;

  },

  {passive:true}
);


document.addEventListener(

  "touchend",

  async function(e){

    if(
      e.changedTouches.length !== 1
    ){

      return;
    }


    const endX =
      e.changedTouches[0].clientX;


    const endY =
      e.changedTouches[0].clientY;


    const dx =
      endX - startX;


    const dy =
      endY - startY;


    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      ) < 45
    ){

      return;
    }


    /*
      左右
    */

    if(
      Math.abs(dx) >
      Math.abs(dy)
    ){

      /*
        左 → 次ホール
      */

      if(
        dx < 0 &&
        hole < pars.length-1
      ){

        hole++;

        localChange = true;

      }


      /*
        右 → 前ホール
      */

      else if(
        dx > 0 &&
        hole > 0
      ){

        hole--;

        localChange = true;
      }

    }


    /*
      上下
    */

    else{

      /*
        上 → 次の人
      */

      if(
        dy < 0 &&
        person < names.length-1
      ){

        person++;

      }


      /*
        下 → 前の人
      */

      else if(
        dy > 0 &&
        person > 0
      ){

        person--;
      }

    }


    saveLocal();

    render();


    /*
      ホール変更の場合だけ
      Supabaseへ現在ホールを保存
    */

    if(localChange){

      await saveToCloud();
    }

  },

  {passive:true}
);


/* ==================================================
   起動
================================================== */

loadLocal();

makeDefaultData();

render();


/*
  起動後にSupabaseから取得
*/

setTimeout(

  async function(){

    await getLatest();

  },

  500
);


/*
  5秒ごとにiPhone側の
  新しいデータを確認
*/

setInterval(

  async function(){

    if(!localChange){

      await getLatest();

    }

  },

  5000
);

</script>

</body>
</html>
