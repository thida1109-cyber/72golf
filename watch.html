<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>72ゴルフ Watch</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#screen{width:100%;height:100vh;display:flex;align-items:flex-start;justify-content:center;touch-action:none}.page{width:100%;max-width:380px;padding:8px 6px 4px;text-align:center}.header{height:46px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:bold}.hole{font-size:30px}.par{font-size:21px}.person{font-size:28px;min-width:72px;overflow:hidden;white-space:nowrap}.input-row{height:67px;display:flex;align-items:center;justify-content:center;gap:6px}.label{width:58px;text-align:left;font-size:19px;font-weight:bold}.button{width:57px;height:57px;flex:0 0 57px;border:1px solid #666;border-radius:12px;background:#222;color:#fff;font-size:31px;font-weight:bold;padding:0}.number{width:50px;flex:0 0 50px;text-align:center;font-size:31px;font-weight:bold}.total{height:52px;margin-top:1px;border-top:1px solid #444;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:bold}.total-number{font-size:30px}.status{margin-top:6px;font-size:18px;color:#fff;min-height:23px;font-weight:bold;line-height:1.15}.help{margin-top:3px;font-size:14px;color:#fff;min-height:18px}
</style>
</head>
<body><div id="screen"></div><script>
const SUPABASE_URL="https://qujiuvxikrmphvfunngn.supabase.co",SUPABASE_TABLE="rounds";
const SUPABASE_PUBLISHABLE_KEY="YOUR_PUBLISHABLE_KEY_HERE";
let key=SUPABASE_PUBLISHABLE_KEY.trim(),roundId=null,pars=[4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5],names=["武田","Aさん","Bさん","Cさん"],scores=Array.from({length:4},()=>Array(18).fill(null)),pats=Array(18).fill(2),person=0,hole=0,status="Supabase接続確認中…",lastCloudData="";
function saveLocal(){try{localStorage.setItem(DATA_STORE,JSON.stringify({roundId,pars,names,scores,pats,person,hole}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(DATA_STORE)||"null");if(!d)return;if(d.roundId!=null)roundId=d.roundId;if(Array.isArray(d.pars)&&d.pars.length===18)pars=d.pars;if(Array.isArray(d.names)&&d.names.length===4)names=d.names;if(Array.isArray(d.scores)&&d.scores.length===4)scores=d.scores;if(Array.isArray(d.pats)&&d.pats.length===18)pats=d.pats;if(Number.isInteger(d.person))person=d.person;if(Number.isInteger(d.hole))hole=d.hole}catch(e){}}
async function getLatest(){try{status="iPhoneデータを読込中…";render();const d=await supabaseRequest(SUPABASE_TABLE+"?select=*&order=id.desc&limit=1");if(!d||!d.length){status="保存データなし";render();return}const x=d[0],cloud=JSON.stringify({id:x.id,players_name:x.players_name,pars:x.pars,scores:x.scores,pats:x.pats,last_hole:x.last_hole});if(cloud===lastCloudData)return;lastCloudData=cloud;roundId=Number(x.id);if(Array.isArray(x.pars)&&x.pars.length===18)pars=x.pars.map(Number);if(Array.isArray(x.scores)&&x.scores.length===4)scores=x.scores.map(row=>{const z=Array(18).fill(null);if(Array.isArray(row))for(let i=0;i<18;i++)z[i]=row[i]==null?null:Number(row[i]);return z});if(Array.isArray(x.pats)&&x.pats.length===18)pats=x.pats.map(v=>v==null?2:Number(v));if(Array.isArray(x.players_name)&&x.players_name.length===4)names=x.players_name.map((v,i)=>v||["武田","Aさん","Bさん","Cさん"][i]);hole=Math.max(0,Math.min(17,Number(x.last_hole)||0));person=0;saveLocal();status="iPhoneデータ：更新済";render()}catch(e){console.error(e);if(e.status===401||e.status===403){status="キーが正しくありません";render()}else{status="読込失敗";render()}}}
function currentScore(){return scores[person][hole]??pars[hole]}function total(){let t=0;for(let i=0;i<=hole;i++)t+=scores[person][i]??pars[i];return t}
async function saveToCloud(){if(roundId===null){status="iPhoneデータ未取得";render();return false}try{status="Watchデータを保存中…";render();await supabaseRequest(SUPABASE_TABLE+"?id=eq."+encodeURIComponent(roundId),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({players_name:names,pars,scores,pats,last_hole:hole})});status="クラウド保存済";return true}catch(e){console.error(e);status="保存失敗";render();return false}}
async function changeScore(d){scores[person][hole]=Math.max(1,Math.min(12,currentScore()+d));saveLocal();render();await saveToCloud()}
async function changePat(d){if(person!==0)return;pats[hole]=Math.max(0,Math.min(10,pats[hole]+d));saveLocal();render();await saveToCloud()}
function render(){const pat=person===0;document.getElementById("screen").innerHTML=`<div class="page"><div class="header"><div class="hole">${hole+1}番</div><div class="par">PAR ${pars[hole]}</div><div class="person">${names[person]}</div></div><div class="input-row"><div class="label">打数</div><button class="button" id="sm">−</button><div class="number">${currentScore()}</div><button class="button" id="sp">＋</button></div>${pat?`<div class="input-row"><div class="label">PAT数</div><button class="button" id="pm">−</button><div class="number">${pats[hole]}</div><button class="button" id="pp">＋</button></div>`:""}<div class="total"><span>合計打数</span><span class="total-number">${total()}</span></div><div class="status">${status||"自動保存"}</div><div class="help">↑↓ 人　← 次ホール　→ 前ホール</div></div>`;document.getElementById("sm").onclick=()=>changeScore(-1);document.getElementById("sp").onclick=()=>changeScore(1);if(pat){document.getElementById("pm").onclick=()=>changePat(-1);document.getElementById("pp").onclick=()=>changePat(1)}}
let sx=0,sy=0;document.addEventListener("touchstart",e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});document.addEventListener("touchend",async e=>{if(e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<45)return;if(Math.abs(dx)>Math.abs(dy)){if(dx<0&&hole<17)hole++;else if(dx>0&&hole>0)hole--}else{if(dy<0&&person<3)person++;else if(dy>0&&person>0)person--}saveLocal();render();await saveToCloud()},{passive:true});
loadLocal();render();getLatest();setInterval(getLatest,3000);
</script></body></html>
