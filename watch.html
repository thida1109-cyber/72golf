<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>72ゴルフ Watch</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
#screen{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;touch-action:none}
.page{width:100%;max-width:360px;padding:10px 12px;text-align:center}
.header{height:42px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:bold}
.hole{font-size:27px}.par{font-size:19px}.person{font-size:25px;min-width:70px}
.input-row{height:62px;display:flex;align-items:center;justify-content:center;gap:7px}
.label{width:54px;text-align:left;font-size:17px;font-weight:bold}
.button{width:52px;height:50px;flex:0 0 52px;border:1px solid #666;border-radius:12px;background:#222;color:#fff;font-size:28px;font-weight:bold;padding:0;margin:0}
.button:active{background:#555}
.number{width:48px;flex:0 0 48px;text-align:center;font-size:29px;font-weight:bold}
.total{height:50px;margin-top:2px;border-top:1px solid #444;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:bold}
.total-number{font-size:27px}.no-pat .total{margin-top:0}
.help{margin-top:8px;font-size:10px;color:#666}
.index-link{display:block;margin-top:7px;color:#888;text-decoration:none;font-size:10px}
</style>
</head>
<body>
<div id="screen"></div>

<script>
const pars=[4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5];
const names=["武田","Aさん","Bさん","Cさん"];
const scores=Array.from({length:4},()=>Array(18).fill(null));
const pats=Array(18).fill(2);
let person=0,hole=0;

function getScore(){return scores[person][hole] ?? pars[hole]}
function changeScore(d){scores[person][hole]=Math.max(1,Math.min(12,getScore()+d));render()}
function changePat(d){if(person!==0)return;pats[hole]=Math.max(0,Math.min(10,pats[hole]+d));render()}
function totalScore(){let t=0;for(let i=0;i<=hole;i++)t+=scores[person][i]??pars[i];return t}

function render(){
 const pat=person===0;
 document.getElementById("screen").innerHTML=`
 <div class="page ${pat?"":"no-pat"}">
  <div class="header">
   <div class="hole">${hole+1}番</div>
   <div class="par">PAR ${pars[hole]}</div>
   <div class="person">${names[person]}</div>
  </div>

  <div class="input-row">
   <div class="label">打数</div>
   <button class="button" id="scoreMinus">−</button>
   <div class="number">${getScore()}</div>
   <button class="button" id="scorePlus">＋</button>
  </div>

  ${pat?`
  <div class="input-row">
   <div class="label">PAT数</div>
   <button class="button" id="patMinus">−</button>
   <div class="number">${pats[hole]}</div>
   <button class="button" id="patPlus">＋</button>
  </div>`:""}

  <div class="total">
   <span>合計打数</span>
   <span class="total-number">${totalScore()}</span>
  </div>

  <div class="help">↑↓ 人　　← 次ホール　→ 前ホール</div>
  <a class="index-link" href="index.html">INDEXへ戻る</a>
 </div>`;

 document.getElementById("scoreMinus").onclick=()=>changeScore(-1);
 document.getElementById("scorePlus").onclick=()=>changeScore(1);

 if(pat){
  document.getElementById("patMinus").onclick=()=>changePat(-1);
  document.getElementById("patPlus").onclick=()=>changePat(1);
 }
}

let sx=0,sy=0;
document.addEventListener("touchstart",e=>{
 if(e.touches.length===1){
  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;
 }
},{passive:true});

document.addEventListener("touchend",e=>{
 if(e.changedTouches.length!==1)return;
 if(e.target.closest && e.target.closest("button,a"))return;

 const dx=e.changedTouches[0].clientX-sx;
 const dy=e.changedTouches[0].clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))<45)return;

 if(Math.abs(dx)>Math.abs(dy)){
  if(dx<0&&hole<17)hole++;
  if(dx>0&&hole>0)hole--;
 }else{
  if(dy<0&&person<3)person++;
  if(dy>0&&person>0)person--;
 }
 render();
},{passive:true});

render();
</script>
</body>
</html>
