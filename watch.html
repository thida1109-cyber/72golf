<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>72ゴルフ Watch v6</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}
.app{
  width:min(100%,360px);
  height:100vh;
  margin:auto;
  padding:12px 10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  touch-action:none;
}
.hole{font-size:28px;font-weight:bold;margin-bottom:2px}
.par{font-size:17px;color:#bbb;margin-bottom:16px}
.name{font-size:27px;font-weight:bold;margin-bottom:12px}
.row{
  display:grid;
  grid-template-columns:58px 58px 1fr 58px;
  align-items:center;
  gap:5px;
  margin:10px 0;
}
.label{text-align:left;font-size:17px;color:#bbb}
.value{font-size:32px;font-weight:bold}
.btn{
  width:58px;height:54px;
  border:1px solid #666;border-radius:13px;
  background:#222;color:#fff;
  font-size:30px;font-weight:bold;padding:0;
}
.btn:active{background:#555}
.total{
  margin-top:12px;padding-top:9px;
  border-top:1px solid #444;
  font-size:16px;color:#bbb;
}
.total span{font-size:25px;color:#fff;font-weight:bold}
.hint{
  position:absolute;bottom:6px;left:0;right:0;
  font-size:10px;color:#666;
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const pars=[4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5];
const names=["武田","Aさん","Bさん","Cさん"];

// scores[人][ホール]
const scores=Array.from({length:4},()=>Array(18).fill(null));
// PATは武田のみ使用
const pats=Array(18).fill(2);

let person=0;
let hole=0;

function getScore(){
  return scores[person][hole] ?? pars[hole];
}

function changeScore(d){
  scores[person][hole]=Math.max(1,Math.min(12,getScore()+d));
  render();
}

function changePat(d){
  if(person!==0)return;
  pats[hole]=Math.max(0,Math.min(10,pats[hole]+d));
  render();
}

function cumulative(){
  let total=0;
  for(let h=0;h<=hole;h++){
    total += scores[person][h] ?? pars[h];
  }
  return total;
}

function render(){
  const showPat=(person===0);

  document.getElementById("app").innerHTML=`
    <div class="hole">${hole+1}番</div>
    <div class="par">PAR ${pars[hole]}</div>
    <div class="name">${names[person]}</div>

    <div class="row">
      <div></div>
      <div class="label">打数</div>
      <button class="btn" type="button" onclick="changeScore(-1)">−</button>
      <div class="value">${getScore()}</div>
      <button class="btn" type="button" onclick="changeScore(1)">＋</button>
    </div>

    ${showPat ? `
    <div class="row">
      <div></div>
      <div class="label">PAT</div>
      <button class="btn" type="button" onclick="changePat(-1)">−</button>
      <div class="value">${pats[hole]}</div>
      <button class="btn" type="button" onclick="changePat(1)">＋</button>
    </div>` : ``}

    <div class="total">
      1番からの累計：<span>${cumulative()}</span> 打
    </div>

    <div class="hint">縦：人　　左：次ホール　右：前ホール</div>
  `;
}

// スワイプ操作
let startX=0,startY=0;

document.addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;
  startX=e.touches[0].clientX;
  startY=e.touches[0].clientY;
},{passive:true});

document.addEventListener("touchend",e=>{
  if(e.changedTouches.length!==1)return;

  const dx=e.changedTouches[0].clientX-startX;
  const dy=e.changedTouches[0].clientY-startY;

  if(Math.max(Math.abs(dx),Math.abs(dy))<45)return;

  // 横スワイプ：ホール切替
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx<0){
      // 左スワイプ＝次のホール
      if(hole<17)hole++;
    }else{
      // 右スワイプ＝前のホール
      if(hole>0)hole--;
    }
  }
  // 縦スワイプ：人切替
  else{
    if(dy<0){
      // 上スワイプ＝次の人
      if(person<3)person++;
    }else{
      // 下スワイプ＝前の人
      if(person>0)person--;
    }
  }

  render();
},{passive:true});

render();
</script>
</body>
</html>
